<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dataset Generator</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f4f2ec; --panel: #fffdf8; --sunken: #ebe8df; --line: #dcd7ca;
  --text: #24231f; --muted: #6d6a60;
  --accent: #0f6e63; --accent-soft: #d6ebe6; --on-accent: #ffffff;
  --call: #7a4b00; --call-soft: #f7ead2; --result: #33566f; --result-soft: #e0eaf1;
  --ok: #1d7044; --ok-soft: #d9efe2; --bad: #a92f2a; --bad-soft: #f8dfdc; --warn: #8a5b00; --warn-soft: #f8ebcd;
  --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #171815; --panel: #20211d; --sunken: #2a2b26; --line: #383a33;
    --text: #ecebe4; --muted: #a09e92;
    --accent: #54c2b1; --accent-soft: #1d3a35; --on-accent: #0c1f1c;
    --call: #e9b768; --call-soft: #3b2f1a; --result: #9cc3de; --result-soft: #22323d;
    --ok: #6fd29c; --ok-soft: #1b3527; --bad: #f09088; --bad-soft: #43221f; --warn: #e6bd6a; --warn-soft: #3b3019;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--sans); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 310px minmax(0, 1fr); height: 100vh; }
.rail { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-right: 1px solid var(--line); }
.brand { padding: 16px 18px 12px; font-weight: 700; letter-spacing: -.01em; font-size: 17px; }
.brand small { display: block; font-weight: 400; font-size: 12.5px; color: var(--muted); letter-spacing: 0; }
.domains { display: flex; flex-direction: column; gap: 2px; padding: 0 10px 12px; border-bottom: 1px solid var(--line); max-height: 34vh; overflow-y: auto; }
.domain { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 9px; border: 0; border-radius: 7px; background: none; text-align: left; }
.domain:hover { background: var(--sunken); }
.domain.active { background: var(--accent-soft); font-weight: 600; }
.domain .name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.badge { font: 600 11px/1 var(--mono); padding: 3px 5px; border-radius: 4px; background: var(--sunken); color: var(--muted); text-transform: uppercase; }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.filter { padding: 10px 10px 6px; }
.filter input { width: 100%; padding: 6px 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); }
.templates { flex: 1; min-height: 0; overflow-y: auto; padding: 0 10px 14px; }
.category { margin: 12px 9px 3px; font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); overflow-wrap: anywhere; }
.template { display: flex; gap: 8px; width: 100%; padding: 4px 9px; border: 0; border-radius: 6px; background: none; text-align: left; font-size: 14px; }
.template:hover { background: var(--sunken); }
.template.active { background: var(--accent); color: var(--on-accent); }
.template .label { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.template .amount { font: 12px/1.7 var(--mono); opacity: .65; }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.head { padding: 14px 24px 0; background: var(--panel); border-bottom: 1px solid var(--line); }
.head h1 { margin: 0; font-size: 19px; letter-spacing: -.01em; overflow-wrap: anywhere; }
.head p { margin: 1px 0 10px; color: var(--muted); font-size: 14px; }
.tabs { display: flex; gap: 2px; }
.tab { padding: 7px 13px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--muted); font-weight: 600; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.view { flex: 1; min-height: 0; overflow-y: auto; padding: 22px 24px 40px; }
.column { max-width: 900px; margin: 0 auto; }

.btn { padding: 7px 14px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); font-weight: 600; }
.btn:hover:not(:disabled) { background: var(--sunken); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.1); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
kbd { font: 11px var(--mono); padding: 1px 5px; border: 1px solid currentColor; border-radius: 4px; opacity: .75; }

.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 18px; }
.toolbar .title { font: 600 14px var(--mono); overflow-wrap: anywhere; flex: 1 1 240px; }
.status { font-size: 13px; font-weight: 600; padding: 3px 9px; border-radius: 99px; }
.status.ok { background: var(--ok-soft); color: var(--ok); }
.status.bad { background: var(--bad-soft); color: var(--bad); }
.status.note { background: var(--sunken); color: var(--muted); }

.chat { display: flex; flex-direction: column; gap: 10px; }
.system { padding: 9px 13px; border: 1px dashed var(--line); border-radius: 9px; color: var(--muted); font-size: 13.5px; }
.system b { display: block; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; }
.turn { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; max-width: 78%; }
.turn.user { align-self: flex-end; align-items: flex-end; }
.bubble { padding: 9px 13px; border-radius: 14px 14px 14px 4px; background: var(--panel); border: 1px solid var(--line); overflow-wrap: anywhere; }
.user .bubble { border-radius: 14px 14px 4px 14px; background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.card { width: 100%; padding: 8px 12px; border-radius: 9px; font: 13px/1.55 var(--mono); overflow-wrap: break-word; }
.card b { font-weight: 700; }
.card.call { background: var(--call-soft); color: var(--call); }
.card.result { background: var(--result-soft); color: var(--result); }
.card .pair { display: block; padding-left: 14px; }
.card .key { opacity: .7; }

.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-top: 24px; }
.fact { padding: 11px 13px; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; }
.fact h3 { margin: 0 0 6px; font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.fact ul { list-style: none; margin: 0; padding: 0; font-size: 13.5px; }
.fact li { display: flex; justify-content: space-between; gap: 10px; overflow-wrap: anywhere; }
.fact li span:last-child { font-family: var(--mono); color: var(--muted); white-space: nowrap; }
.errors { margin: 0 0 18px; padding: 10px 14px; border-radius: 9px; background: var(--bad-soft); color: var(--bad); font-size: 14px; overflow-wrap: anywhere; }
.errors ul { margin: 4px 0 0; padding-left: 18px; }

.tool { margin-bottom: 14px; padding: 14px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.tool header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.tool h2 { flex: 1 1 200px; margin: 0; font: 700 15px var(--mono); overflow-wrap: anywhere; }
.tool p { margin: 5px 0 10px; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); padding: 4px 12px 4px 0; }
td { padding: 5px 12px 5px 0; border-top: 1px solid var(--line); vertical-align: top; }
td code, .enum { font: 13px var(--mono); }
.req { color: var(--accent); font-weight: 700; }
pre { margin: 10px 0 0; padding: 12px; max-height: 340px; overflow: auto; background: var(--sunken); border-radius: 8px; font: 12.5px/1.5 var(--mono); }
.linkish { padding: 0; border: 0; background: none; color: var(--accent); font-size: 13px; font-weight: 600; }

.section { margin-bottom: 18px; padding: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.section h2 { margin: 0 0 10px; font-size: 15px; }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 4px 14px; }
label.check { display: flex; align-items: center; gap: 8px; padding: 3px 0; overflow-wrap: anywhere; }
.summary { display: flex; flex-wrap: wrap; gap: 6px 26px; margin-bottom: 12px; }
.summary div b { display: block; font-size: 20px; letter-spacing: -.01em; overflow-wrap: anywhere; }
.summary div span { font-size: 12.5px; color: var(--muted); }
.summary .path b { font: 600 14px/2 var(--mono); }
.alert { margin-bottom: 12px; padding: 10px 13px; border-radius: 8px; font-size: 14px; }
.alert.warn { background: var(--warn-soft); color: var(--warn); }
.alert.bad { background: var(--bad-soft); color: var(--bad); }
.alert label { display: flex; gap: 8px; margin-top: 6px; font-weight: 600; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.bar { height: 10px; margin: 12px 0 8px; border-radius: 99px; background: var(--sunken); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s ease; }
.muted { color: var(--muted); }
.empty { padding: 48px 12px; text-align: center; color: var(--muted); }

@media (max-width: 820px) {
  html, body { height: auto; }
  .app { display: block; height: auto; }
  .rail { border-right: 0; border-bottom: 1px solid var(--line); }
  .templates { max-height: 38vh; }
  .view { overflow: visible; padding: 18px 16px 32px; }
  .head { padding: 14px 16px 0; }
  .turn { max-width: 94%; }
}
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">Dataset Generator<small>Synthetic conversations</small></div>
    <nav class="domains" id="domains" aria-label="Domains"></nav>
    <div class="filter"><input id="filter" type="search" placeholder="Filter templates" aria-label="Filter templates"></div>
    <nav class="templates" id="templates" aria-label="Templates"></nav>
  </aside>
  <main class="main">
    <div class="head">
      <h1 id="title">Loading</h1>
      <p id="subtitle"></p>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="conversation">Conversation</button>
        <button class="tab" role="tab" data-tab="tools">Tools</button>
        <button class="tab" role="tab" data-tab="generate">Generate</button>
      </div>
    </div>
    <div class="view" id="view"><div class="column" id="content"></div></div>
  </main>
</div>
<script>
"use strict";

const LANGUAGE_NAMES = { en: "English", de: "German" };

const state = {
  domains: [], domain: null, detail: null, template: null,
  tab: "conversation", filter: "", selected: new Set(), plan: null,
  job: null, replace: false, schemaOpen: new Set(), previewToken: 0, planToken: 0,
};

const $ = (id) => document.getElementById(id);

// Everything from the data is set as text, never as HTML.
function el(tag, attributes = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attributes)) {
    if (key === "class") node.className = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else if (value === true) node.setAttribute(key, "");
    else if (value !== false && value != null) node.setAttribute(key, value);
  }
  for (const child of children.flat()) {
    if (child != null && child !== false) node.append(child);
  }
  return node;
}

function fill(node, ...children) {
  node.replaceChildren(...children.flat(Infinity).filter((child) => child != null && child !== false));
}

async function api(path, body) {
  const options = body === undefined ? {} : {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  };
  const response = await fetch(path, options);
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || response.statusText);
  return data;
}

function showError(error) {
  fill($("content"), el("div", { class: "errors" }, String(error.message || error)));
}

/* ---------- navigation ---------- */

function writeHash() {
  const parts = [state.domain, state.tab, state.template].filter(Boolean).map(encodeURIComponent);
  history.replaceState(null, "", "#" + parts.join("/"));
}

function readHash() {
  const [domain, tab, ...template] = location.hash.slice(1).split("/").map(decodeURIComponent);
  return { domain, tab, template: template.join("/") };
}

async function selectDomain(name, wanted = {}) {
  state.domain = name;
  state.filter = "";
  $("filter").value = "";
  state.schemaOpen.clear();
  renderDomains();
  try {
    state.detail = await api("/api/domain?name=" + encodeURIComponent(name));
  } catch (error) {
    state.detail = null;
    $("title").textContent = name;
    $("subtitle").textContent = "";
    fill($("templates"));
    showError(error);
    return;
  }
  const ids = state.detail.templates.map((t) => t.id);
  state.template = ids.includes(wanted.template) ? wanted.template : ids[0] || null;
  renderHeader();
  renderTemplates();
  render();
}

function selectTemplate(id) {
  state.template = id;
  state.tab = "conversation";
  renderTemplates();
  render();
}

/* ---------- rail ---------- */

function renderDomains() {
  fill($("domains"), state.domains.map((domain) =>
    el("button", {
      class: "domain" + (domain.name === state.domain ? " active" : ""),
      "aria-current": domain.name === state.domain ? "true" : false,
      onclick: () => selectDomain(domain.name),
    },
      el("span", { class: "name" }, domain.name),
      domain.error
        ? el("span", { class: "badge warn" }, "error")
        : [
            domain.gaps ? el("span", { class: "badge warn", title: domain.gaps + " items left to translate" }, domain.gaps) : null,
            el("span", { class: "badge" }, domain.language),
          ],
    )));
}

function renderTemplates() {
  const groups = new Map();
  const needle = state.filter.toLowerCase();
  for (const template of state.detail ? state.detail.templates : []) {
    if (needle && !template.id.toLowerCase().includes(needle)) continue;
    const split = template.id.lastIndexOf("/");
    const group = split < 0 ? "" : template.id.slice(0, split);
    if (!groups.has(group)) groups.set(group, []);
    groups.get(group).push({ ...template, label: template.id.slice(split + 1) });
  }
  const nodes = [];
  for (const [group, templates] of groups) {
    if (group) nodes.push(el("div", { class: "category" }, group.replaceAll("_", " ")));
    for (const template of templates) {
      nodes.push(el("button", {
        class: "template" + (template.id === state.template ? " active" : ""),
        "aria-current": template.id === state.template ? "true" : false,
        onclick: () => selectTemplate(template.id),
      },
        el("span", { class: "label" }, template.label.replaceAll("_", " ")),
        el("span", { class: "amount", title: "Planned amount" }, template.amount),
      ));
    }
  }
  fill($("templates"), nodes.length ? nodes : el("div", { class: "empty" }, "No templates"));
}

function renderHeader() {
  const detail = state.detail;
  $("title").textContent = detail.name;
  const language = LANGUAGE_NAMES[detail.language] || detail.language;
  $("subtitle").textContent = language + " · " + detail.templates.length + " templates · "
    + detail.tools.length + " tools" + (detail.description ? " · " + detail.description : "");
}

/* ---------- conversation ---------- */

function pairs(object) {
  const entries = Object.entries(object || {});
  if (!entries.length) return [el("span", { class: "pair" }, "no arguments")];
  return entries.map(([key, value]) => el("span", { class: "pair" },
    el("span", { class: "key" }, key + ": "),
    typeof value === "string" ? value : JSON.stringify(value, null, 1).replace(/\s*\n\s*/g, " ")));
}

function renderMessage(message) {
  if (message.role === "system") {
    return el("div", { class: "system" }, el("b", {}, "System"), message.content);
  }
  if (message.role === "tool") {
    const content = typeof message.content === "object" && message.content !== null
      ? pairs(message.content) : [String(message.content)];
    return el("div", { class: "turn" }, el("div", { class: "card result" },
      el("b", {}, "← " + (message.name || "tool")), content));
  }
  const calls = message.tool_calls
    ? [].concat(message.tool_calls) : message.tool_call ? [message.tool_call] : [];
  return el("div", { class: "turn " + message.role },
    message.content ? el("div", { class: "bubble" }, message.content) : null,
    calls.map((call) => el("div", { class: "card call" }, el("b", {}, "→ " + call.name), pairs(call.arguments))));
}

function fact(title, rows) {
  return el("div", { class: "fact" }, el("h3", {}, title), el("ul", {},
    rows.map(([left, right]) => el("li", {}, el("span", {}, left), el("span", {}, right)))));
}

async function renderConversation() {
  const content = $("content");
  if (!state.template) {
    fill(content, el("div", { class: "empty" }, "This domain has no templates to render."));
    return;
  }
  const token = ++state.previewToken;
  const another = el("button", { class: "btn primary", onclick: renderConversation },
    "Render another ", el("kbd", {}, "R"));
  const statusSlot = el("span", { class: "status note" }, "Rendering");
  const toolbar = el("div", { class: "toolbar" },
    el("span", { class: "title" }, state.template), statusSlot, another);
  if (!content.querySelector(".toolbar")) fill(content, toolbar);
  else content.querySelector(".toolbar").replaceWith(toolbar);

  let result;
  try {
    result = await api("/api/preview?domain=" + encodeURIComponent(state.domain)
      + "&template=" + encodeURIComponent(state.template));
  } catch (error) {
    if (token === state.previewToken && state.tab === "conversation") showError(error);
    return;
  }
  if (token !== state.previewToken || state.tab !== "conversation") return;

  const valid = !result.errors.length;
  const status = valid
    ? el("span", { class: "status ok" }, result.rejected ? "Valid, " + result.rejected + " rejected before" : "Valid")
    : el("span", { class: "status bad" }, "Rejected by validators");
  statusSlot.replaceWith(status);

  const facts = [];
  if (result.wording.length) {
    facts.push(fact("Wording drawn", result.wording.map((w) => [w.name, w.choice + " / " + w.size])));
  }
  const about = [["Behaviour", (result.behaviour || "unknown").replaceAll("_", " ")]];
  for (const tag of result.tags) about.push(["Tag", tag]);
  facts.push(fact("About", about));
  if (result.tools.length) {
    const counts = {};
    for (const tool of result.tools) counts[tool] = (counts[tool] || 0) + 1;
    facts.push(fact("Tools called", Object.entries(counts).map(([name, count]) => [name, "× " + count])));
  }

  fill(content,
    toolbar,
    valid ? null : el("div", { class: "errors" }, "Generation would discard this draw:",
      el("ul", {}, result.errors.map((error) => el("li", {}, error)))),
    el("div", { class: "chat" }, result.messages.map(renderMessage)),
    el("div", { class: "facts" }, facts),
  );
}

/* ---------- tools ---------- */

function typeOf(spec) {
  if (spec.enum) return el("span", { class: "enum" }, spec.enum.join(" | "));
  const range = spec.minimum !== undefined || spec.maximum !== undefined
    ? " (" + (spec.minimum ?? "") + "–" + (spec.maximum ?? "") + ")" : "";
  return el("code", {}, spec.type + range);
}

function renderTool(tool) {
  const properties = Object.entries(tool.parameters.properties);
  const open = state.schemaOpen.has(tool.name);
  const json = JSON.stringify(tool.definition, null, 2);
  return el("article", { class: "tool" },
    el("header", {},
      el("h2", {}, tool.name),
      el("span", { class: "status " + (tool.side_effects ? "note" : "ok") }, tool.side_effects ? "Changes something" : "Read only"),
    ),
    el("p", {}, tool.description),
    properties.length ? el("div", { class: "table-wrap" }, el("table", {},
      el("thead", {}, el("tr", {}, ["Argument", "Type", "Description"].map((h) => el("th", {}, h)))),
      el("tbody", {}, properties.map(([name, spec]) => el("tr", {},
        el("td", {}, el("code", {}, name), tool.parameters.required.includes(name) ? el("span", { class: "req", title: "Required" }, " *") : null),
        el("td", {}, typeOf(spec)),
        el("td", {}, spec.description || ""),
      ))),
    )) : el("p", { class: "muted" }, "No arguments."),
    el("div", { class: "actions", style: "margin-top:10px" },
      el("button", { class: "linkish", "aria-expanded": String(open), onclick: () => {
        if (open) state.schemaOpen.delete(tool.name); else state.schemaOpen.add(tool.name);
        renderTools();
      } }, open ? "Hide JSON schema" : "Show JSON schema"),
      el("button", { class: "linkish", onclick: (event) => {
        navigator.clipboard.writeText(json).then(() => {
          event.target.textContent = "Copied";
          setTimeout(() => { event.target.textContent = "Copy JSON"; }, 1400);
        });
      } }, "Copy JSON"),
    ),
    open ? el("pre", {}, json) : null,
  );
}

function renderTools() {
  const gaps = state.detail.gaps;
  fill($("content"),
    gaps.length ? el("div", { class: "alert warn" },
      el("strong", {}, gaps.length + " items left to translate"),
      el("ul", {}, gaps.slice(0, 8).map((gap) => el("li", {}, gap))),
      gaps.length > 8 ? "and " + (gaps.length - 8) + " more" : null) : null,
    state.detail.tools.length
      ? state.detail.tools.map(renderTool)
      : el("div", { class: "empty" }, "This domain has no tools."),
  );
}

/* ---------- generate ---------- */

async function refreshPlan() {
  const token = ++state.planToken;
  state.plan = null;
  state.replace = false;
  const names = [...state.selected];
  let plan = null;
  if (names.length) {
    const query = names.map((name) => "domain=" + encodeURIComponent(name)).join("&");
    try {
      plan = await api("/api/plan?" + query);
    } catch (error) {
      plan = { error: error.message };
    }
  }
  // The selection may have changed while this was on its way.
  if (token !== state.planToken) return;
  state.plan = plan;
  if (state.tab === "generate") renderGenerate();
}

function renderJob() {
  const job = state.job;
  if (!job || job.status === "idle") return null;
  const percent = job.planned ? Math.min(100, Math.round(100 * job.done / job.planned)) : 0;
  const labels = { running: "Running", finished: "Finished", failed: "Failed", stopped: "Stopped" };
  const classes = { running: "note", finished: "ok", failed: "bad", stopped: "bad" };
  const incomplete = job.status === "finished" && job.gave_up > 0;
  return el("section", { class: "section" },
    el("div", { class: "actions" },
      el("h2", { style: "margin:0;flex:1" }, "Run: " + job.domains.join(", ")),
      el("span", { class: "status " + classes[job.status] }, labels[job.status]),
      job.status === "running" ? el("button", { class: "btn danger", onclick: stopJob }, "Stop") : null,
    ),
    el("div", { class: "bar", role: "progressbar", "aria-valuemin": 0, "aria-valuemax": 100, "aria-valuenow": percent },
      el("i", { style: "width:" + percent + "%" })),
    el("div", { class: "muted" }, job.done.toLocaleString() + " of " + job.planned.toLocaleString()
      + " conversations" + (job.skipped ? ", " + job.skipped + " skipped" : "")),
    incomplete ? el("div", { class: "alert warn", style: "margin-top:12px" },
      job.gave_up + " template(s) ran out of different conversations before reaching their amount. See the log.") : null,
    job.status === "stopped" ? el("div", { class: "alert warn", style: "margin-top:12px" },
      "Stopped before merging. Conversations written so far stay in Synthetic_Data; " + job.target + " was not updated.") : null,
    job.status === "finished" ? el("p", {}, "Dataset and tool schemas are in ", el("code", {}, job.target), ".") : null,
    el("pre", { id: "log" }, job.log.join("\n") || "Waiting for output"),
  );
}

function renderGenerate() {
  const running = state.job && state.job.status === "running";
  const plan = state.plan;
  const needsConfirm = plan && plan.exists;
  const blocked = !plan || plan.error || running || (needsConfirm && !state.replace);

  const picker = el("section", { class: "section" },
    el("h2", {}, "What to generate"),
    el("div", { class: "checks" }, state.domains.filter((d) => !d.error).map((domain) =>
      el("label", { class: "check" },
        el("input", { type: "checkbox", checked: state.selected.has(domain.name), disabled: running, onchange: (event) => {
          if (event.target.checked) state.selected.add(domain.name); else state.selected.delete(domain.name);
          refreshPlan();
        } }),
        el("span", {}, domain.name),
        el("span", { class: "badge" }, domain.language),
      ))),
  );

  let summary = null;
  if (plan && plan.error) {
    summary = el("section", { class: "section" }, el("div", { class: "alert bad" }, plan.error));
  } else if (plan) {
    summary = el("section", { class: "section" },
      el("div", { class: "summary" },
        el("div", {}, el("b", {}, plan.planned.toLocaleString()), el("span", {}, "conversations")),
        el("div", {}, el("b", {}, plan.templates.toLocaleString()), el("span", {}, "templates")),
        el("div", { class: "path" }, el("b", {}, plan.target), el("span", {}, "merged dataset and tool schemas")),
      ),
      needsConfirm ? el("div", { class: "alert " + (plan.approved ? "bad" : "warn") },
        plan.approved
          ? el("strong", {}, plan.target + " is approved for publishing, and this replaces it. The next publish would upload the new data.")
          : el("strong", {}, plan.target + " already exists, and this replaces it."),
        el("label", {},
          el("input", { type: "checkbox", checked: state.replace, disabled: running, onchange: (event) => {
            state.replace = event.target.checked;
            renderGenerate();
          } }),
          "Replace the existing dataset"),
      ) : null,
      el("div", { class: "actions" },
        el("button", { class: "btn primary", disabled: blocked, onclick: startJob }, running ? "Running" : "Generate"),
        el("span", { class: "muted" }, "Writes to Synthetic_Data, then merges. Nothing is published."),
      ),
    );
  }

  fill($("content"), picker, summary, renderJob());
  const log = $("log");
  if (log) log.scrollTop = log.scrollHeight;
}

let polling = null;

function pollJob() {
  if (polling) return;
  polling = setInterval(async () => {
    try {
      state.job = await api("/api/job");
    } catch (error) {
      return;
    }
    if (state.job.status !== "running") {
      clearInterval(polling);
      polling = null;
      state.replace = false;
      await refreshPlan();
    } else if (state.tab === "generate") {
      renderGenerate();
    }
  }, 1000);
}

async function startJob() {
  try {
    state.job = await api("/api/generate", { domains: [...state.selected], replace_existing: state.replace });
    state.replace = false;
    renderGenerate();
    pollJob();
  } catch (error) {
    state.plan = { error: error.message };
    renderGenerate();
  }
}

async function stopJob() {
  try {
    state.job = await api("/api/stop", {});
  } catch (error) {
    return;
  }
  renderGenerate();
}

/* ---------- shell ---------- */

function render() {
  for (const tab of document.querySelectorAll(".tab")) {
    const active = tab.dataset.tab === state.tab;
    tab.classList.toggle("active", active);
    tab.setAttribute("aria-selected", String(active));
  }
  writeHash();
  $("view").scrollTop = 0;
  if (!state.detail && state.tab !== "generate") return;
  if (state.tab === "conversation") {
    fill($("content"));
    renderConversation();
  } else if (state.tab === "tools") {
    renderTools();
  } else {
    if (!state.selected.size && state.domain) {
      state.selected.add(state.domain);
      refreshPlan();
    }
    renderGenerate();
  }
}

for (const tab of document.querySelectorAll(".tab")) {
  tab.addEventListener("click", () => {
    state.tab = tab.dataset.tab;
    render();
  });
}

$("filter").addEventListener("input", (event) => {
  state.filter = event.target.value;
  renderTemplates();
});

document.addEventListener("keydown", (event) => {
  const typing = event.target.matches("input, textarea");
  if (!typing && !event.ctrlKey && !event.metaKey && !event.altKey
      && event.key.toLowerCase() === "r" && state.tab === "conversation" && state.template) {
    renderConversation();
  }
});

(async function start() {
  const wanted = readHash();
  try {
    state.domains = await api("/api/domains");
    state.job = await api("/api/job");
  } catch (error) {
    $("title").textContent = "Could not reach the generator";
    showError(error);
    return;
  }
  if (["conversation", "tools", "generate"].includes(wanted.tab)) state.tab = wanted.tab;
  if (state.job.status === "running") {
    for (const name of state.job.domains) state.selected.add(name);
    pollJob();
  }
  const usable = state.domains.filter((d) => !d.error).map((d) => d.name);
  const first = usable.includes(wanted.domain) ? wanted.domain : usable[0] || state.domains[0]?.name;
  if (first) await selectDomain(first, wanted);
  else $("title").textContent = "No domains found";
})();
</script>
</body>
