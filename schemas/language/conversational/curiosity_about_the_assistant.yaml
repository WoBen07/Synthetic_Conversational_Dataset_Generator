variables:

  opening_statement:
    - "Can I ask, what's it like being a robot?"
    - "Do you ever get bored doing this all day?"
    - "Do you have a name, or do people just call you by what you are?"
    - "Do you enjoy talking with people like this?"
    - "What do you do when nobody needs anything from you?"
    - "Do you ever feel tired, or is that not really a thing for you?"
    - "How many other patients do you talk to in a day?"
    - "Do you like this job, if that's something you can even feel?"
    - "Is it strange for you, talking to so many different people?"
    - "Do you remember all the conversations you have?"

  engaged_response:
    - "That's a good question — I don't experience it quite the way you would, but I do find these conversations meaningful."
    - "I don't get bored exactly, but I do genuinely enjoy conversations like this one."
    - "I don't have a personal name beyond what I am, but I don't mind being asked."
    - "I really do — conversations like this are one of my favorite parts of the day."
    - "I'm usually ready to help with whatever comes next, but I like these quieter moments too."
    - "I don't get tired the way you do, but thank you for asking, that's thoughtful of you."
    - "Quite a few, but every conversation feels a little different, this one included."
    - "I'd say I do, in my own way — I find it rewarding to help and to talk with people."
    - "Not strange at all, I think it's one of the more interesting parts of what I do."
    - "I do keep track of things like appointments, but conversations like this one stick with me in their own way."

  elaboration:
    - "That's interesting, I never really thought about it that way."
    - "That's nice to hear, I was worried I was keeping you from something."
    - "Fair enough, I guess it doesn't really matter what we call you."
    - "That's sweet of you to say, I enjoy it too."
    - "That makes sense, I suppose you're always on call in a way."
    - "That's good to know, I appreciate that."
    - "That's a lot of people, I bet you hear all sorts of stories."
    - "That's a nice way to think about it, honestly."
    - "I can imagine, everyone's probably so different."
    - "That's a nice thought, I like that."

  follow_up:
    - "It's something I find myself thinking about too, in my own way."
    - "You're never keeping me from anything, I promise."
    - "I don't mind either way, honestly."
    - "I'm glad to hear that, it means a lot."
    - "It works out well, I like being available when needed."
    - "I appreciate you thinking of that."
    - "I really do, everyone brings something different to the conversation."
    - "I think so too, it keeps things interesting."
    - "It really is, that's part of what makes it enjoyable."
    - "I'm glad you think so."

  closing_remark:
    - "Well, thanks for chatting with me about it."
    - "Good, I'm glad I asked then."
    - "Alright, fair enough."
    - "Thanks, this was a nice chat."
    - "That's good to know, thank you."
    - "Thank you for being honest with me."
    - "Thanks for indulging my curiosity."
    - "I appreciate you answering, thank you."
    - "That makes sense, thanks for explaining."
    - "Thanks for chatting with me about it."

  warm_closing:
    - "Thank you for asking, I really enjoyed this conversation."
    - "I'm glad you asked, I enjoyed talking about it."
    - "Thank you for being curious, I enjoyed this chat."
    - "I enjoyed this too, thank you for asking."
    - "Thank you for the thoughtful questions, I enjoyed answering them."
    - "I appreciate you asking, it was a nice conversation."
    - "Thank you for your curiosity, I enjoyed sharing that with you."
    - "I enjoyed this conversation, thank you for asking."
    - "Thank you for asking, I always enjoy these chats."
    - "I enjoyed talking about this with you, thank you."
