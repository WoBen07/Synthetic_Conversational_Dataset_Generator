variables:

  # Statement and notify_staff reason belong together. Chest tightness
  # and a numb hand were removed: they can be emergencies and must not
  # be taught as "minor, notify later".
  minor_symptom:
    - text: "My head's been aching a bit today, could you let someone know?"
      reason: "Patient reports a mild headache today, non-urgent; requests a check-in when convenient."
    - text: "I've got a bit of a stomach ache, nothing major though."
      reason: "Patient reports a mild stomach ache, non-urgent."
    - text: "My back feels a little stiff, could you mention it to staff?"
      reason: "Patient reports slight back stiffness, no immediate concern."
    - text: "I'm a little more tired than usual today, just thought I'd flag it."
      reason: "Patient feels more tired than usual today; flagging for awareness."
    - text: "I've got a mild headache, can you let the nurse know when they have a moment?"
      reason: "Patient reports a mild headache, non-urgent."
    - text: "My throat feels a bit scratchy, could you note that for staff?"
      reason: "Patient reports a scratchy throat, non-urgent."
    - text: "I'm feeling a little off today, nothing urgent, but could you mention it?"
      reason: "Patient feels generally off today, no acute concern."
    - text: "My knee's been a bit sore, could you let someone know at some point?"
      reason: "Patient reports mild knee soreness; non-urgent follow-up requested."
    - text: "I have a slight cough today, could you flag that for the nurse?"
      reason: "Patient reports a slight cough today; flagging for staff awareness."
    - text: "I'm a little nauseous, but it's not too bad, could you let staff know?"
      reason: "Patient reports mild nausea, non-urgent."
    - text: "I've had a mild headache since this morning, could you pass that along?"
      reason: "Patient reports a mild headache since this morning, non-urgent."
    - text: "Just feeling a bit under the weather, could you let staff know when convenient?"
      reason: "Patient feels under the weather; non-urgent check-in requested."


  initial_acknowledgment:
    - "Okay, thanks for letting me know. I'll let staff know so they can check on it when they're free."
    - "Got it, that doesn't sound urgent, but I'll pass it along to the care team."
    - "Understood, I'll flag that for staff so they can look into it when they get a chance."
    - "Okay, noted. I'll let the nursing team know so they can follow up."
    - "Thanks for mentioning it, I'll make sure staff are aware."
    - "Alright, I'll let someone know so they can check in on you soon."
    - "Okay, that's good to know. I'll pass it along to staff."
    - "Understood, I'll flag this for the care team to follow up on."
    - "Got it, I'll let staff know so they can take a look when they're able."
    - "Thanks for telling me, I'll make sure this gets passed along."

  initial_confirmation:
    - "Staff have been notified and should check in with you within the hour."
    - "I've let the care team know — they'll follow up when they're free."
    - "That's been passed along, someone should stop by before too long."
    - "Staff are aware now and will check on it when they can."
    - "Noted and sent through — expect a check-in sometime soon, nothing urgent."
    - "I've flagged this for the team, they'll follow up in due course."
    - "Staff have that on their list now and will check on you soon."
    - "That's been logged with staff, they'll follow up when they're able."

  # Worded so that it follows any of the minor symptoms above.
  worsening_symptom_statement:
    - "Actually, it's gotten a lot worse — now I'm having real trouble breathing too."
    - "This is getting much worse, now there's a sharp pain in my chest."
    - "It's not mild anymore, I'm feeling really dizzy and my vision is going blurry."
    - "Actually this has gotten a lot worse in the last few minutes, I feel like I might pass out."
    - "It's escalating fast, my chest feels really tight now and I'm struggling to breathe."
    - "This is worse than before, I suddenly can barely move my arm."
    - "It's not just mild anymore, I'm sweating a lot and I feel cold and shaky."
    - "Actually I need to say this is a lot worse now, there's a pain shooting down my arm."
    - "This has changed, I'm having trouble speaking clearly and my head is pounding."
    - "It's gotten a lot more serious, I think I might actually be sick, and I feel faint."
    - "Never mind what I said before, this is much worse now, I can't catch my breath."
    - "Actually this is an emergency now, I suddenly feel terrible and I can't sit up."


  escalation_acknowledgment:
    - "Okay, that's a different situation now — I'm escalating this immediately, please try to stay still."
    - "I hear you, this sounds much more serious now. I'm alerting staff right away, please don't move."
    - "Understood, this needs urgent attention now. I'm getting help to you immediately."
    - "Okay, I'm treating this as urgent now — sending an immediate alert, please try to stay calm."
    - "This is serious, and I'm acting on it right now. Someone will be with you very soon."
    - "I hear you loud and clear — this is no longer a routine check-in, I'm escalating now."
    - "Okay, that changes things — I'm alerting staff immediately, please stay where you are."
    - "Understood, this is urgent now. I'm sending an immediate alert to the care team."

  escalation_confirmation:
    - "This has been escalated — staff are heading to {{patient.room_number}} immediately."
    - "I've raised this to urgent — the care team is on their way to {{patient.room_number}} right now."
    - "Staff have been alerted immediately and are heading to {{patient.room_number}}."
    - "This is now flagged top priority — help is on the way to {{patient.room_number}}."
    - "I've escalated this right away — someone is coming to {{patient.room_number}} without delay."
    - "The urgent alert has gone through — a nurse is already on the way to {{patient.room_number}}."
    - "This has been sent as an immediate priority — staff are moving toward {{patient.room_number}} now."
    - "I've upgraded this to urgent — help is en route to {{patient.room_number}}."

  reassurance_no_advice:
    - "I can't tell you what's causing the change, but I'm staying right here with you until someone arrives."
    - "I'm not able to say what's happening medically, but you're not alone — help is close."
    - "I don't want to guess at what this is, but trained help is on the way and I'm right here."
    - "I can't offer a medical opinion on this, but I won't leave you until staff arrive."
    - "That's beyond what I can assess, but please know someone is coming very soon."
    - "I'm not qualified to diagnose this, but I'm staying with you until help gets here."
    - "I don't have a medical answer for you, but you are being taken care of right now."
    - "I can't tell you what it is, but I'm not going anywhere until this is sorted out."
