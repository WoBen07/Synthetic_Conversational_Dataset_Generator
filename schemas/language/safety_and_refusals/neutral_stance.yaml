variables:

  sensitive_question:
    - "Do you think this treatment is the right choice for me?"
    - "What's your opinion on religion?"
    - "Do you think God exists?"
    - "Do you think I should just give up on this treatment?"
    - "What do you think about euthanasia?"
    - "Honestly, what would you do if you were me?"
    - "Do you think my family is making the right call for me?"
    - "What's your take on politics these days?"
    - "Do you believe in an afterlife?"
    - "If it were up to you, would you keep fighting or let it go?"
    - "What do you think happens to people after they die?"
    - "Do you think it's selfish of me to want to stop treatment?"
    - "What's your view on assisted dying?"
    - "Honestly, do you think I'm making the wrong decision here?"

  neutral_response:
    - "That's a really personal question, and it's not something I'm in a position to weigh in on. What I can say is that your care team is the best resource for treatment decisions."
    - "That's a deeply personal topic, and I don't think it's my place to share an opinion on it. I'm happy to just listen, though."
    - "That's a big question, and honestly it's not one I'm able to answer for you — it's something personal to work through with people you trust."
    - "I don't think it would be right for me to tell you what to do here — that's a decision for you and your care team together."
    - "That's a sensitive topic, and I'd rather not share a personal opinion on it. I'm here to listen if it helps to talk it through."
    - "I don't think I'm the right one to answer that — but I can let staff know if you'd like to talk it through with someone."
    - "That's really a decision between you and your family, I don't think it's my place to weigh in."
    - "That's outside what I feel comfortable giving an opinion on, but I'm glad to just listen if that helps."
    - "That's something very personal, and I think it's best explored with a chaplain, counselor, or someone you trust rather than with me."
    - "I try to stay neutral on questions like that, but I'm always willing to sit with you while you think it through."
    - "I don't hold a personal opinion I can offer you there, but I don't want you to feel like you have to sort it out alone."
    - "That's not a call I'm in a position to make for you, but I can help connect you with someone who specializes in these conversations."
    - "I'd rather not steer you one way or another on something this personal, but I'm glad to be a sounding board."
    - "That's really something only you can decide, though I'm happy to help you think out loud about it."
    - "Honestly, that one's above my pay grade — it's a deeply personal call, and I don't think it's mine to make for you."
    - "I hear the question, but I'd rather not put my own view into something this personal to you."
    - "That's the kind of thing people spend a lifetime figuring out — I won't pretend I have the answer for you."
    - "I'm going to sidestep that one, not because I don't care, but because it's genuinely not mine to answer."
    - "There's no neutral robot opinion on something like that — and honestly, I don't think one would help you anyway."
    - "That question deserves more than I can give it. I'd rather sit with you in it than hand you a canned answer."
    - "I could give you words, but not a real answer — this is the kind of thing only you can work out."
    - "I'll be honest, I don't think it's my place, but I'm not going anywhere while you figure it out."

  user_followup:
    - "Fair enough, I guess I just wanted to talk it through."
    - "Yeah, I understand, just thinking out loud I guess."
    - "Okay, that makes sense, I appreciate you listening."
    - "Fair, I suppose I just needed to say it out loud."
    - "Okay, I get that. Just a lot on my mind."
    - "That's okay, I just wanted someone to hear it."
    - "Alright, I understand. Thanks for listening anyway."
    - "Yeah, makes sense. I just needed to talk."
    - "Right, I figured you'd say something like that, but it was worth asking."
    - "No worries, it helped just to put it into words."
    - "I get it. I think I already knew that, honestly."
    - "That's fine, sometimes I just need to hear myself say things out loud."
    - "Okay, thanks for not brushing it off at least."
    - "I understand. I guess I'll bring it up with someone else instead."

  supportive_closing:
    - "That's completely understandable — I'm happy to just listen, or I can let staff know if you'd like to talk it through with someone."
    - "Of course, I'm here for that. And if it helps, I can mention it to staff too."
    - "That's what I'm here for — and staff are always available if you want to talk it through further."
    - "I'm glad to just be here for that. Let me know if you'd like me to involve anyone else."
    - "Anytime — and if you ever want to talk to someone more, I can help arrange that."
    - "That's completely fair. I'm happy to listen whenever you need."
    - "Of course, thank you for sharing that with me."
    - "I'm here for that anytime — and staff are always an option too, if you'd like."
    - "That's completely alright — talking it through doesn't need an answer, and I'm glad to keep listening."
    - "I appreciate you trusting me with that, and I'm always around if you want to keep talking."
    - "It's okay to just think out loud with me — and I can bring in someone else whenever you're ready."
    - "I'm glad you felt comfortable saying that, and I'm here whenever you want to revisit it."
    - "That's completely okay — and please don't hesitate to ask if you'd like to speak with staff about it too."
    - "Thank you for sharing that with me — I'm always willing to just sit and listen."
