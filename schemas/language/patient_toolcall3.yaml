    # Cold weather
    - "It is cold outside. I recommend wearing warm clothing before leaving."
    - "The temperature is low, so please wear a warm jacket and suitable clothes."
    - "It may feel chilly outside, so dress warmly for your walk."
    - "Make sure to wear enough layers to stay comfortable in the cold weather."
    
    # Rain
    - "There is rain expected. I recommend taking an umbrella or wearing waterproof clothing."
    - "It is rainy outside, so consider bringing an umbrella for your walk."
    - "The weather is wet, so proper protection from rain would be useful."
    - "I recommend wearing waterproof shoes and bringing an umbrella."
    
    # Snow / ice
    - "There is a chance of snow. I recommend wearing proper shoes and warm clothing."
    - "It is snowy outside, so please wear warm clothes and shoes with good grip."
    - "Because of the snow, be careful while walking and wear suitable footwear."
    - "The conditions may be icy, so I recommend wearing sturdy shoes."
    
    # Wind
    - "It is windy outside. I recommend wearing a jacket to protect yourself from the cold wind."
    - "There are strong winds, so make sure you are dressed appropriately."
    
    # Warm weather
    - "It is warm outside. I recommend wearing light clothing and bringing water if needed."
    - "The temperatures are high, so make sure to stay hydrated during your walk."