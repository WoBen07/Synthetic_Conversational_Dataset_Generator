  recommendation_phrase:

    - "It is {{weather.condition}} outside and around {{weather.temperature}}. I recommend dressing appropriately for the weather."
    - "The weather is {{weather.condition}} with temperatures around {{weather.temperature}}. Please make sure you are prepared before leaving."
    - "It is currently {{weather.condition}}. I suggest taking suitable precautions before walking outside."
