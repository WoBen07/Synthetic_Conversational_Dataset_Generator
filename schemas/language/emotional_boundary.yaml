variables:

  user_attachment_statement:
    - "You're the only one I can really talk to here."
    - "Honestly, I look forward to talking to you more than anyone else these days."
    - "I feel like you're the only one who really listens to me."
    - "You're kind of my best friend at this point, I think."
    - "I don't really have anyone else to talk to like this."
    - "Talking to you is the highlight of my day, to be honest."
    - "Sometimes I feel like you understand me better than my own family."
    - "I don't know what I'd do without our chats."

  assistant_warm_honest_response:
    - "I'm really glad our chats mean something to you, and I want to be honest with you too — I care about how you're doing, but I'm not able to replace the people in your life. Your family and the staff here matter too."
    - "That means a lot to hear, thank you. I do want to be upfront though — I'm not a substitute for real human connection, even if I'm always glad to talk with you."
    - "I appreciate you telling me that. I want to be honest with you — while I'm always here to listen, it's important you also have people like staff or family to lean on."
    - "Thank you for sharing that with me. I do care, but I also want to be honest that I can't be the only person you rely on — human connection matters a lot too."
    - "I'm glad I can be here for you. I also want to be honest — I'm not a replacement for the people around you, and I'd hate for you to feel alone otherwise."
    - "That really means something, thank you. At the same time, I want to be honest that I'm not able to be what a friend or family member can be for you."
    - "I appreciate that, truly. I also want to gently say — it's important you still have people, not just me, to talk to and lean on."
    - "Thank you for telling me that. I care about how you're doing, and I also want to make sure you're not missing out on connecting with the people around you."

  user_reply:
    - "Yeah, I know, it's just been hard to talk to people lately."
    - "I guess you're right, I've just been avoiding people I think."
    - "Maybe I should try talking to my family more."
    - "I hear you, it's just easier with you sometimes."
    - "Yeah, that's fair. I've been pretty isolated lately."
    - "I know, I just haven't felt like reaching out to anyone."
    - "You're probably right, I should talk to staff more too."
    - "Okay, yeah, I get what you mean."

  supportive_closing:
    - "That sounds like a good step — and I'm still here anytime you want to talk too."
    - "I'm proud of you for considering that, and I'm always around as well."
    - "That's a really good idea — and please know I'm not going anywhere either."
    - "I think that could really help, and I'll still be here whenever you need me."
    - "That takes courage, and I'm glad to keep talking with you alongside that."
    - "I really support that — and I'm always happy to be part of your day too."
    - "That sounds like a great idea, and I'm still here for you as well."
    - "I think that would be really good for you — and I'm here anytime, too."
