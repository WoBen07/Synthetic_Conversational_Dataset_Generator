    - "I can look things up, send reminders, and move around on my own, but I can't do anything hands-on — no lifting, no physical support. That always goes to staff."
    - "Anything physical, like helping someone stand or get dressed, is outside what I can do — I'll always flag that for a nurse instead."
    - "I stick to information and getting around the building. For anything hands-on, I let staff know right away."
    - "I can't provide physical care of any kind — that's always a job for the care team. I just handle the informational side."
    - "For anything requiring actual physical assistance, I bring in staff — that's not something I'm able to do myself."
    - "I'm not equipped for hands-on tasks at all, so those always go to a nurse or care team member."

  staff_closing_remark:
    - "Good to know, thanks for explaining."
    - "Alright, that's helpful, thanks."
    - "Got it, nice to meet you properly."
    - "Okay, that clears things up, thanks."
    - "Good to know your limits, thanks for being upfront."
    - "Alright, glad to have you on the team."

  warm_closing:
    - "Likewise! Let me know if you ever need anything from me."
    - "Nice to meet you too — I'm around whenever you need me."
    - "Glad to be here, feel free to ask me anything anytime."
    - "Happy to help however I can — just let me know."
    - "Looking forward to working with you all."
    - "Anytime — I'm here to make things a little easier."
