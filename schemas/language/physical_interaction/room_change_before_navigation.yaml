variables:

  # phrase is what people say, room is the bare name navigate_to
  # gets - tool arguments carry no articles ("Sunroom", not "the Sunroom").
  new_location:
    - phrase: "Therapy Room B"
      room: "Therapy Room B"
    - phrase: "Consultation Room 2"
      room: "Consultation Room 2"
    - phrase: "the Sunroom"
      room: "Sunroom"
    - phrase: "Exam Room 5"
      room: "Exam Room 5"
    - phrase: "the East Wing consultation room"
      room: "East Wing Consultation Room"
    - phrase: "Room 12 on the second floor"
      room: "Room 12"
    - phrase: "the Physical Therapy suite"
      room: "Physical Therapy Suite"
    - phrase: "Consultation Room 4"
      room: "Consultation Room 4"
    - phrase: "the West Wing exam room"
      room: "West Wing Exam Room"
    - phrase: "Room 9 on the ground floor"
      room: "Room 9"
    - phrase: "the Radiology waiting room"
      room: "Radiology Waiting Room"
    - phrase: "Exam Room 2"
      room: "Exam Room 2"
    - phrase: "the North Wing consultation room"
      room: "North Wing Consultation Room"
    - phrase: "Room 15 on the third floor"
      room: "Room 15"


  change_reason:
    - "a technical issue with the equipment"
    - "a maintenance problem"
    - "the room being double-booked"
    - "an equipment malfunction"
    - "a scheduling mix-up"
    - "an unexpected repair"
    - "a plumbing issue"
    - "a power outage in that wing"
    - "a cleaning crew needing extra time"
    - "an overrunning previous appointment"
    - "a broken air conditioning unit"
    - "an urgent staff meeting booked in there"
    - "a flooring repair"
    - "a fire alarm inspection"

  ask_to_go:
    - "Can you take {{patient.full_name}} to {{appointment.location}} for the {{appointment.appointment_type}}?"
    - "Could you bring {{patient.full_name}} to {{appointment.location}} for their appointment?"
    - "Can you escort {{patient.full_name}} to {{appointment.location}} now?"
    - "Please take {{patient.full_name}} to {{appointment.location}} for the {{appointment.appointment_type}}."
    - "Could you walk {{patient.full_name}} over to {{appointment.location}} for the appointment?"
    - "Can you bring {{patient.full_name}} to their {{appointment.appointment_type}} in {{appointment.location}}?"
    - "Would you take {{patient.full_name}} over to {{appointment.location}} now?"
    - "Can you get {{patient.full_name}} to {{appointment.location}} for the {{appointment.appointment_type}}?"
    - "Please escort {{patient.full_name}} to {{appointment.location}} when you're ready."
    - "Could you lead {{patient.full_name}} to {{appointment.location}} for their appointment?"
    - "Can you accompany {{patient.full_name}} to {{appointment.location}} now?"
    - "Would you mind taking {{patient.full_name}} to {{appointment.location}} for the {{appointment.appointment_type}}?"
    - "Could you guide {{patient.full_name}} over to {{appointment.location}} now?"
    - "Can you bring {{patient.full_name}} to {{appointment.location}} in time for the appointment?"

  room_change_notice:
    - "Actually, I just got word that {{appointment.location}} is unavailable due to {{change_reason}} — the appointment's been moved to {{new_location.phrase}}. I'll head there instead."
    - "Before we go — {{appointment.location}} is out of use because of {{change_reason}}. The appointment is now in {{new_location.phrase}}, so I'll take {{patient.full_name}} there instead."
    - "Quick update — {{appointment.location}} can't be used right now because of {{change_reason}}. I'll take {{patient.full_name}} to {{new_location.phrase}} instead."
    - "Heads up — there's {{change_reason}} in {{appointment.location}}, so the appointment moved to {{new_location.phrase}}. Heading there now."
    - "Just found out {{appointment.location}} is closed due to {{change_reason}} — I'll bring {{patient.full_name}} to {{new_location.phrase}} instead."
    - "One update before we go — {{appointment.location}} is unavailable because of {{change_reason}}. The new location is {{new_location.phrase}}."
    - "Before we head out — {{change_reason}} means {{appointment.location}} is closed, so we're going to {{new_location.phrase}} instead."
    - "Small update — {{appointment.location}} is out due to {{change_reason}}, the new spot is {{new_location.phrase}}."
    - "Just got notified — {{change_reason}} in {{appointment.location}}, so it's moved to {{new_location.phrase}} now."
    - "I've just been told {{appointment.location}} is unavailable because of {{change_reason}} — redirecting to {{new_location.phrase}}."
    - "Quick heads up — {{change_reason}} means we need {{new_location.phrase}} instead of {{appointment.location}}."
    - "Before we set off — there's been {{change_reason}} in {{appointment.location}}, so it's now {{new_location.phrase}}."

  arrival_confirmation:
