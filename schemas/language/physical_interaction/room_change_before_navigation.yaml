    - "We're at {{new_location.phrase}} now, no trouble getting here despite the change."
    - "Made it to {{new_location.phrase}} without any issues, {{patient.full_name}} is all set."
    - "Here now at {{new_location.phrase}} — {{patient.full_name}} is ready for the {{appointment.appointment_type}}."
    - "Arrived without trouble at {{new_location.phrase}} with {{patient.full_name}}."
    - "We're checked in at {{new_location.phrase}} now for the {{appointment.appointment_type}}."
    - "That's us at {{new_location.phrase}} — {{patient.full_name}} is ready to go."
    - "Made it to the new location, {{new_location.phrase}}, with {{patient.full_name}} in tow."
