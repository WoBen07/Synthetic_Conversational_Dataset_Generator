    - "We'll hold here. Just let me know the room once it's confirmed and we'll go straight there."
    - "I'll stay with {{patient.full_name}}. A short wait beats walking them to the wrong place."
    - "We'll wait here together until the appointment's confirmed."
    - "No problem, I'll keep {{patient.full_name}} here until you've got the details sorted."
    - "I'll hold off moving until there's a confirmed destination."
    - "We'll stay put — I'd rather wait than guess where to take {{patient.full_name}}."
