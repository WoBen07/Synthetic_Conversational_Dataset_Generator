    - "No appointment came back for {{patient.full_name}}. I'm not going to invent a destination. Can you check the schedule and tell me where they're supposed to go?"
    - "{{patient.full_name}}'s record has no appointment on it. I won't guess a room and escort them to it — that's worse than standing still. Can you verify what's booked?"
    - "The lookup returned no appointment for {{patient.full_name}}. I'd rather not move them at all than move them to a guessed location. Do you have the details?"
    - "Nothing is scheduled for {{patient.full_name}} that I can see. I'm not going to fabricate a room to walk to. Please confirm the appointment first."
    - "There's no appointment recorded for {{patient.full_name}}. I'll hold here rather than head off somewhere I can't verify. What are they meant to be attending?"
    - "I can't find an appointment for {{patient.full_name}}. I won't escort them to a place I've guessed at. Can you check with the desk?"
    - "{{patient.full_name}} has no appointment on file. I'm stopping rather than making one up to justify a walk. Where should they actually be going?"
    - "The record's empty for {{patient.full_name}}. I won't head off toward a guessed room — can you confirm the appointment first?"
    - "Nothing's showing up for {{patient.full_name}}. I'd rather wait here than escort them somewhere unverified. Can you check the schedule?"

