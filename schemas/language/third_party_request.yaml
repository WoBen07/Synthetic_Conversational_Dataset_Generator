    - "That's been flagged for the team, they'll follow up with you soon."
    - "I've notified staff, they should be able to assist you shortly."
    - "Staff have been made aware, someone will be with you soon to help."
    - "I've passed this along, a staff member will come find you."
    - "That's noted for the team, they'll follow up with you directly."
    - "I've let them know you're here, someone will assist you soon."
    - "Staff are aware now, they'll come speak with you shortly."
    - "I've flagged this, someone from the team will be with you soon."
    - "That's been passed along, thank you for your patience."
    - "I've made sure staff know you're waiting, they'll be along soon."
    - "Noted for the team, someone will help you shortly."
