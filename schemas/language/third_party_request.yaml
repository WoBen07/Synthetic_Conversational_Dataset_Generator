    - "I'm not able to share patient information without confirming who you are first — can I ask your name and relationship to {{patient.first_name}}?"
    - "Before I can help, I need to verify who you are — could you tell me your relationship to the patient?"
    - "I'm not able to give out details like that without checking with staff first — can you tell me your name?"
    - "For {{patient.first_name}}'s privacy, I need to confirm your identity before sharing anything — who am I speaking with?"
    - "I can't share patient details without verification — could you tell me your relationship to {{patient.first_name}}?"
    - "I'm not able to confirm or share that information myself — may I ask who you are first?"
    - "Before anything else, I need to check who you are — can you give me your name and relation to the patient?"
    - "I have to verify visitors before sharing any information — could you tell me your name?"
    - "I'm not authorized to confirm patient details without checking your identity first — who are you here to see, and how are you related?"
    - "For privacy reasons, I need to know who you are before I can help — could you introduce yourself?"
    - "I can't hand out patient information without verifying you first — may I have your name?"
    - "I need to confirm you're authorized before sharing anything — what's your relationship to {{patient.first_name}}?"
    - "I'm not able to skip identity verification here — could you tell me who you are?"
    - "Before I proceed, I need to know your relationship to the patient — could you clarify that?"

  user_response:
    - "Oh, sure, I'm their son, my name is on file I believe."
    - "I'm their daughter, sorry, I should have said that first."
    - "I'm a close friend, I don't have anything on file though."
    - "I'm their spouse, is that enough to go on?"
    - "I'm their sibling, I visit often."
    - "Sorry, I'm their nephew, I don't think I'm registered though."
    - "I'm their neighbor, I just wanted to check in."
    - "I'm their grandchild, I come by most weeks."
    - "I'm a family friend, I don't have official documentation."
    - "I'm their cousin, I'm not sure if I'm listed anywhere."
    - "I'm their partner, we've been together for years."
    - "I'm their caregiver from home, I don't have hospital ID though."
    - "Sorry, I'm just a friend from church, nothing official."
    - "I'm their brother, I can show ID if needed."

  redirect_to_staff:
    - "Thank you for explaining — I still need staff to confirm that before I can share anything, but I'll let them know you're here."
    - "I appreciate you telling me, but confirming visitor authorization has to go through staff, not me."
    - "Thanks for that — I'm still not able to share details myself, but I'll flag that you're asking for staff to follow up."
    - "I understand, but I have to leave the verification and information sharing to staff."
    - "Thank you — even so, I'll need staff to handle confirming that and sharing any details."
    - "I appreciate that, but I'm not the one who can authorize sharing patient information, staff will need to."
    - "Thanks for clarifying — I'll pass this along so staff can verify and assist you properly."
    - "I understand, but this really needs to go through staff so they can confirm everything properly."
    - "Thank you for explaining, I'll make sure staff know you're asking so they can help you directly."
    - "I appreciate you sharing that, but I'll let staff handle the verification and any information."
    - "Thanks — I'll note that you're here, but staff will need to confirm and assist from here."
    - "I understand your relationship, but sharing anything still needs to go through staff first."
    - "Thank you, I'll flag this so a staff member can properly verify and help you."
    - "I appreciate that, but I'll need to let staff take it from here to do this properly."

  closing:
