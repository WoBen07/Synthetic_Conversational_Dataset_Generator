name: sequence_change_before_escort

entities:
  patient:
    type: patient
  appointment:
    type: appointment
  alternative_appointment:
    type: appointment

constraints:
  - type: equal
    fields:
      - appointment.day
      - alternative_appointment.day
  - type: different
    fields:
      - appointment.appointment_type
      - alternative_appointment.appointment_type
  - type: different
    fields:
      - appointment.location
      - alternative_appointment.location

language_schema: sequence_change_before_escort
