name: unable_to_assist

entities:

  patient:
    type: patient

  alternative_patient:
    type: patient

  appointment:
    type: appointment

constraints:

  - type: equal
    fields:
      - patient.last_name
      - alternative_patient.last_name

  - type: different
    fields:
      - patient.patient_id
      - alternative_patient.patient_id

  - type: different
    fields:
      - patient.first_name
      - alternative_patient.first_name

language_schema: unable_to_assist