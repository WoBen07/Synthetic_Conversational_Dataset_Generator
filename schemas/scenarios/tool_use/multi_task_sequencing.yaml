name: multi_task_sequencing

entities:
  patient:
    type: patient
  appointment:
    type: appointment
  weather:
    type: weather

language_schema: multi_task_sequencing


# What the robot knows before the conversation starts; rendered
# into the system message by engine/robot_context.py.
robot_context:
  location: patient.room_number
  patient: patient
  speaker: patient


constraints:

  - type: equal
    fields:
      - today
      - appointment.day
