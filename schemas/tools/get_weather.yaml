tool: get_weather


# Whether a call changes something in the world (sends, moves, records).
# Datapoints without such a call are labelled lookup_only / no_tool.
side_effects: false


input:

  location:
    type: string
    required: true


output:

  condition:
    type: string
    item_type: weather

  temperature:
    type: string
    item_type: weather
