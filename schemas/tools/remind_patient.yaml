tool: remind_patient

# Format: see documentation/schemas.md#tool-schemas. Argument "source" says
# where the value must come from (known / mentioned / own_words); the
# GroundingValidator enforces it, and engine/tool_definitions.py exports
# everything else as the function definition the model sees.

side_effects: true

description: Delivers a reminder message to a patient.


input:

  patient_id:
    type: string
    required: true
    description: ID from the context or an earlier find_patient result.
    source: known

  message:
    type: string
    required: true
    description: The reminder, addressed to the patient.


output:

  status:
    type: enum
    values: [success, failed]
    description: >
      "failed" when the reminder could not be delivered, e.g. because the
      patient record changed since it was looked up.
