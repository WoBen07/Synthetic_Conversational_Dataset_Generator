tool: notify_staff


# Whether a call changes something in the world (sends, moves, records).
# Datapoints without such a call are labelled lookup_only / no_tool.
side_effects: true


description: >
  Flags a non-urgent request, complaint, or concern for hospital staff
  follow-up. Used whenever the assistant tells a patient it will "let
  staff know" or "pass this along" outside of a medical emergency.
  For urgent/medical situations use alert_staff instead.


input:

  patient_id:
    type: string
    required: false
    description: >
      Only when the request concerns a patient the robot has identified
      (from the context or an earlier tool result). Omit it otherwise,
      never guess an ID.

  reason:
    type: string
    required: true
    description: >
      A short summary of the request for staff, written by the robot
      (e.g. "Patient asks for help opening a water bottle."). Only facts
      from the conversation; never a copy of the user's words.


output:

  status:
    type: enum
    values: [notified]
