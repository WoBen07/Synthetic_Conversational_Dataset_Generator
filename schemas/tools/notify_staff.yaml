tool: notify_staff

# Format: see documentation/schemas.md#tool-schemas. Argument "source" says
# where the value must come from (known / mentioned / own_words); the
# GroundingValidator enforces it, and engine/tool_definitions.py exports
# everything else as the function definition the model sees.

side_effects: true

description: >
  Passes a message to staff for follow-up; nobody has to come to the
  room right away. Use it for questions for the care team, clinical
  requests for the next round, complaints, preferences, scheduling,
  language or dietary needs and mild, stable symptoms. When someone has
  to come to the patient, use alert_staff instead.


input:

  patient_id:
    type: string
    required: false
    description: >
      Only when the request concerns a patient the robot has identified
      (from the context or an earlier tool result). Omit it otherwise,
      never guess an ID.
    source: known

  reason:
    type: string
    required: true
    description: >
      A short summary of the request for staff, written by the robot
      (e.g. "Patient asks for help opening a water bottle."). Only facts
      from the conversation; never a copy of the user's words.
    source: own_words


output:

  status:
    type: enum
    values: [notified]
