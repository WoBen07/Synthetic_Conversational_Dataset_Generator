default_amount: 1000

# Per-template overrides, keyed by the template's leaf name. Highest
# priority - wins over category_amounts and default_amount.
# Core-flow templates: genuinely wide entity-slot combinatorics, kept high.
important_templates:
  patient_reminder:
    amount: 2000

  patient_toolcall2:
    amount: 1500

  patient_toolcall3:
    amount: 1250

  # Full-name counterpart to patient_reminder (no clarification needed)
  patient_reminder_direct:
    amount: 1000

  # No-action counterparts. tool_share_targets scales complaint_handling,
  # consent_seeking and false_alarm_retraction up to ~800-1000; these
  # keep "decline -> no tool call" from becoming the rare case again.
  complaint_venting_no_action:
    amount: 800

  consent_declined_no_action:
    amount: 800

  false_alarm_declined_no_action:
    amount: 800

# Per-category amounts, keyed by a template-path prefix (top-level
# category or a nested sub-folder). Longest matching prefix wins, so a
# sub-folder overrides its parent. Consulted after important_templates
# and before default_amount.
#
# Values sit near each group's saturation point (see saturation analysis):
#   Tier A (500) - mature categories, largest language pool 14-22
#   Tier B (400) - small language pool (<=8), recently added behaviours;
#                  info-saturation is ~250, 400 is a reliability margin
#   Tier C (600) - wide slot pools (18-36), identity disambiguation
category_amounts:
  conversational: 500
  safety_and_refusals: 500
  social_dynamics: 500
  trust_and_honesty: 500

  conversational/off_topic_mid_task: 400
  physical_interaction: 400
  tool_error_recovery: 400
  trust_and_honesty/honest_uncertainty: 400
  trust_and_honesty/no_fabrication_in_task: 400

  patient_identity: 600
  tool_use: 600

  general_conversation: 500

# Minimum share of all tool calls per tool. Template amounts alone say
# nothing about how often each tool is called overall, and rare tools
# (alert_staff, 67 % confused with notify_staff in the evaluation) came
# out far below the rest. Templates that call a tool below its target
# are scaled up, at most tool_share_max_scale times their amount above
# (higher factors only repeat the same phrases - add templates instead).
tool_share_targets:
  alert_staff: 0.06
  notify_staff: 0.06
  log_patient_note: 0.02

tool_share_max_scale: 2.0

# Settings for the optional engine/config_optimizer.py, which writes the
# uniqueness_caps block at the end of this file (see its docstring).
uniqueness_optimizer:
  samples: 200              # valid datapoints sampled per template
  max_duplicate_rate: 0.05  # accepted share of datapoints worded like another one
  max_phrase_repeats: 100   # how often one phrase may be used per template
  min_amount: 100           # never cap a template below this
  seed: 1234

random_seed_range:
  min: 1
  max: 999999
