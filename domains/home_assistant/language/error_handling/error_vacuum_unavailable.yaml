variables:

  mode:
    - value: vacuum
      infinitive: "saugen"
      present: "saugt"
      noun: "Saugen"
    - value: mop
      infinitive: "wischen"
      present: "wischt"
      noun: "Wischen"
    - value: vacuum_and_mop
      infinitive: "saugen und wischen"
      present: "saugt und wischt"
      noun: "Saugen und Wischen"

  request:
    - "Lass {{vacuum.accusative}} die ganze Wohnung {{mode.infinitive}}."
    - "{{vacuum.nominative_cap}} soll alles {{mode.infinitive}}."
    - "{{vacuum.nominative_cap}} soll die ganze Wohnung {{mode.infinitive}}."
    - "{{vacuum.nominative_cap}} soll überall {{mode.infinitive}}."
    - "Lass {{vacuum.accusative}} bitte alles {{mode.infinitive}}."
    - "Kannst du {{vacuum.accusative}} die komplette Wohnung {{mode.infinitive}} lassen?"
    - "Starte {{vacuum.accusative}}, er soll alles {{mode.infinitive}}."
    - "Schick {{vacuum.accusative}} los, er soll die ganze Wohnung {{mode.infinitive}}."

  failure:
    - "Das hat leider nicht geklappt, Fridolin ist gerade nicht erreichbar."
    - "Fridolin reagiert gerade nicht, das {{mode.noun}} konnte ich nicht starten."
    - "Tut mir leid, ich erreiche Fridolin gerade nicht."
    - "Das ging leider nicht, Fridolin ist nicht erreichbar."
    - "Fridolin ist gerade offline, das {{mode.noun}} ist also nicht gestartet."
