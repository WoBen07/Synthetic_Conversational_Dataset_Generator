# The home_assistant domain: a German voice assistant controlling lights,
# heating and the vacuum robot Fridolin in a flat. See documentation/domains.md.

name: home_assistant

description: >
  Deutschsprachiger Sprachassistent für das Zuhause, der Licht, Heizung und
  den Saugroboter Fridolin steuert.

# The conversations are German: no English article rules (engine/domain.py).
language: de

# This domain has no generated IDs.
generated_id_pattern: null

# Wording of the opening system message (engine/robot_context.py).
robot_context:

  # Nothing in this domain depends on the weekday.
  today: null

  speakers:
    resident: "Du bist der Sprachassistent dieses Zuhauses und steuerst Licht, Heizung und den Saugroboter Fridolin über die verfügbaren Tools. Du sprichst mit einer Person, die hier wohnt."
