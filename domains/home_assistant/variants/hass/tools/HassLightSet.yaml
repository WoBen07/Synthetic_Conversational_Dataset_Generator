tool: HassLightSet
side_effects: true
description: Stellt Helligkeit oder Farbe eines Lichts ein.
input:
  area:
    type: string
    description: Raum genau so, wie er in der Geräteliste steht.
    source: known
    format: name
  name:
    type: string
    description: Name eines Geräts, einer Szene oder eines Skripts aus der Geräteliste.
    source: known
    format: name
  domain:
    type: enum
    values:
    - light
    description: Art des Geräts.
  brightness:
    type: integer
    minimum: 0
    maximum: 100
    description: Helligkeit in Prozent.
    source: known
  color:
    type: string
    description: Farbe auf Englisch.
output:
  status:
    type: enum
    values:
    - ok
    - unavailable
    - not_supported
    - stuck
    - bin_full
    - not_found
  state:
    type: enum
    values:
    - 'on'
    - 'off'
  brightness_pct:
    type: integer
  color:
    type: string
  temperature:
    type: number
  current_temperature:
    type: number
  target_temperature:
    type: number
  humidity_pct:
    type: integer
  window_open:
    type: boolean
