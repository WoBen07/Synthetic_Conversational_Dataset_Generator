tool: HassGetState
side_effects: false
description: Fragt den Zustand eines Geräts ab.
input:
  area:
    type: string
    description: Raum genau so, wie er in der Geräteliste steht.
    source: known
    format: name
  name:
    type: string
    description: Name eines Geräts, einer Szene oder eines Skripts aus der Geräteliste.
    source: known
    format: name
  domain:
    type: enum
    values:
    - light
    description: Art des Geräts.
  device_class:
    type: enum
    values:
    - humidity
    - window
    description: Geräteklasse.
output:
  status:
    type: enum
    values:
    - ok
    - unavailable
    - not_supported
    - stuck
    - bin_full
    - not_found
  state:
    type: enum
    values:
    - 'on'
    - 'off'
  brightness_pct:
    type: integer
  color:
    type: string
  temperature:
    type: number
  current_temperature:
    type: number
  target_temperature:
    type: number
  humidity_pct:
    type: integer
  window_open:
    type: boolean
