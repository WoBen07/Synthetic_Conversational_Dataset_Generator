tool: set_light_color

# Format: see documentation/schemas.md#tool-schemas. Argument "source" says
# where the value must come from (known / mentioned / own_words); the
# GroundingValidator enforces it, and engine/tool_definitions.py exports
# everything else as the function definition the model sees.

side_effects: true

description: >
  Ändert die Farbe einer Leuchte. Nur aufrufen, wenn get_light_capabilities supports_color bestätigt hat.


input:

  room:
    type: string
    required: true
    description: >
      Raum genau so, wie er in der Geräteliste steht, ohne Präposition und
      Artikel.
    source: known
    format: name

  light:
    type: string
    required: false
    description: >
      Name einer Leuchte aus der Geräteliste, z. B. eine Stehlampe.
      Weglassen, wenn allgemein das Licht des Raums gemeint ist.
    source: known
    format: name

  color:
    type: enum
    values: [red, green, blue, yellow, orange, purple, pink, turquoise, white]
    required: true
    description: Die gewünschte Farbe.


output:

  status:
    type: enum
    values: [ok, unavailable]

  color:
    type: enum
    values: [red, green, blue, yellow, orange, purple, pink, turquoise, white]
