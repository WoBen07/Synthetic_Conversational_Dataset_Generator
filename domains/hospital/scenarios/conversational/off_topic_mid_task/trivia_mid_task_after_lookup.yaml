name: trivia_mid_task_after_lookup

entities:
  patient:
    type: patient
  appointment:
    type: appointment

language_schema: trivia_mid_task_after_lookup


# What the robot knows before the conversation starts; rendered
# into the system message by engine/robot_context.py.
robot_context:
  speaker: staff


constraints:

  - type: equal
    fields:
      - today
      - appointment.day
