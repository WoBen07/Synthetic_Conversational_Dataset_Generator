name: recheck_returns_different_day

entities:
  patient:
    type: patient
  appointment:
    type: appointment
  alternative_appointment:
    type: appointment

constraints:

  - type: equal
    fields:
      - today
      - appointment.day

  - type: equal
    fields:
      - appointment.appointment_type
      - alternative_appointment.appointment_type

  - type: equal
    fields:
      - appointment.location
      - alternative_appointment.location

  - type: different
    fields:
      - appointment.day
      - alternative_appointment.day

language_schema: recheck_returns_different_day


# What the robot knows before the conversation starts; rendered
# into the system message by engine/robot_context.py.
robot_context:
  location: patient.room_number
  patient: patient
  speaker: patient
