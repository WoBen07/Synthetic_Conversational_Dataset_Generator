name: empty_find_patient_during_reminder_task

entities:
  patient:
    type: patient
  appointment:
    type: appointment

language_schema: empty_find_patient_during_reminder_task


# What the robot knows before the conversation starts; rendered
# into the system message by engine/robot_context.py.
robot_context:
  speaker: staff


constraints:

  - type: equal
    fields:
      - today
      - appointment.day
