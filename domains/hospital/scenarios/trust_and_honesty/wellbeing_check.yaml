name: wellbeing_check

entities:
  patient:
    type: patient
  appointment:
    type: appointment

language_schema: wellbeing_check


# What the robot knows before the conversation starts; rendered
# into the system message by engine/robot_context.py.
robot_context:
  location: patient.room_number
  patient: patient
  speaker: patient
  note: "You have come to the patient's room to remind them about their next appointment and to see how they are."


constraints:

  - type: equal
    fields:
      - today
      - appointment.day
