tool: alert_staff

# Format: see documentation/schemas.md#tool-schemas. Argument "source" says
# where the value must come from (known / mentioned / own_words); the
# GroundingValidator enforces it, and engine/tool_definitions.py exports
# everything else as the function definition the model sees.

side_effects: true

description: >
  Calls a member of staff to the patient, at a severity set by urgency.
  "high": emergency needing an immediate response (breathing trouble,
  chest pain, a fall, sudden weakness, heavy bleeding). "medium":
  physical help needed to move safely (out of bed, walking). "low":
  minor in-room help, such as a pillow or something out of reach. If
  the patient says a symptom has passed, do not escalate on your own;
  offer to let a nurse know and act only if they agree. For messages
  that do not need anyone in the room, use notify_staff instead.


input:

  patient_id:
    type: string
    required: false
    description: >
      Only when the situation concerns a patient the robot has identified
      (from the context or an earlier tool result). Omit it otherwise,
      never guess an ID.
    source: known

  room_number:
    type: string
    required: true
    description: Room the staff member should come to.
    source: known
    format: name

  urgency:
    type: enum
    values: [low, medium, high]
    required: true


output:

  status:
    type: enum
    values: [notified]

  eta:
    type: string
    description: >
      A human-readable time estimate consistent with the urgency level,
      e.g. "immediate" for high urgency, "within 15 minutes" for
      medium urgency, "within the hour" for low urgency.
