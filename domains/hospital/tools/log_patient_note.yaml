tool: log_patient_note

# Format: see documentation/schemas.md#tool-schemas. Argument "source" says
# where the value must come from (known / mentioned / own_words); the
# GroundingValidator enforces it, and engine/tool_definitions.py exports
# everything else as the function definition the model sees.

side_effects: true

description: >
  Records a note in the patient's chart for care-team continuity. Use
  it whenever you tell a patient that you are noting or logging
  something they said.


input:

  patient_id:
    type: string
    required: true
    description: ID from the context or an earlier find_patient result.
    source: known

  note:
    type: string
    required: true
    description: >
      A short summary in the robot's words of what the patient said.
      Only facts from the conversation; never a copy of the user's
      message.
    source: own_words


output:

  status:
    type: enum
    values: [logged]
