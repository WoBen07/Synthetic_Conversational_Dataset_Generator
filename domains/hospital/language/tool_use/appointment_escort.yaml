    - "I've walked {{patient.full_name}} to {{appointment.location}} for the {{appointment.appointment_type}} scheduled on {{appointment.day}}."
    - "{{patient.full_name}} has arrived at {{appointment.location}} for {{patient.possessive_pronoun}} {{appointment.appointment_type}}."
    - "Done. {{patient.full_name}} is now at {{appointment.location}} for {{patient.possessive_pronoun}} {{appointment.appointment_type}} on {{appointment.day}}."
    - "I've taken {{patient.full_name}} to {{appointment.location}}. {{patient.pronoun}} is ready for the {{appointment.appointment_type}}."
    - "{{patient.full_name}} made it to {{appointment.location}} for {{patient.possessive_pronoun}} {{appointment.appointment_type}}, right on schedule."
    - "We've reached {{appointment.location}}. {{patient.full_name}} is checked in for the {{appointment.appointment_type}} on {{appointment.day}}."
    - "I've escorted {{patient.full_name}} to {{appointment.location}} for {{patient.possessive_pronoun}} {{appointment.appointment_type}}, as requested."
    - "{{patient.full_name}} is now at {{appointment.location}}, ready for {{patient.possessive_pronoun}} {{appointment.appointment_type}} on {{appointment.day}}."
