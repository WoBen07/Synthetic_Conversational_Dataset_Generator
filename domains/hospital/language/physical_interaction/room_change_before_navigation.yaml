variables:

  # phrase is what people say, room is the bare name navigate_to
  # gets - tool arguments carry no articles ("Sunroom", not "the Sunroom").
  new_location:
    - phrase: "Therapy Room B"
      room: "Therapy Room B"
    - phrase: "Consultation Room 2"
      room: "Consultation Room 2"
    - phrase: "the Sunroom"
      room: "Sunroom"
    - phrase: "Exam Room 5"
      room: "Exam Room 5"
    - phrase: "the East Wing consultation room"
      room: "East Wing Consultation Room"
    - phrase: "Room 12 on the second floor"
      room: "Room 12"
    - phrase: "the Physical Therapy suite"
      room: "Physical Therapy Suite"
    - phrase: "Consultation Room 4"
      room: "Consultation Room 4"
    - phrase: "the West Wing exam room"
      room: "West Wing Exam Room"
    - phrase: "Room 9 on the ground floor"
      room: "Room 9"
    - phrase: "the Radiology waiting room"
      room: "Radiology Waiting Room"
    - phrase: "Exam Room 2"
      room: "Exam Room 2"
    - phrase: "the North Wing consultation room"
      room: "North Wing Consultation Room"
    - phrase: "Room 15 on the third floor"
      room: "Room 15"


  ask_to_go:
    - "Can you take {{patient.full_name}} to {{appointment.location}} for the {{appointment.appointment_type}}?"
    - "Could you bring {{patient.full_name}} to {{appointment.location}} for their appointment?"
    - "Can you escort {{patient.full_name}} to {{appointment.location}} now?"
    - "Please take {{patient.full_name}} to {{appointment.location}} for the {{appointment.appointment_type}}."
    - "Could you walk {{patient.full_name}} over to {{appointment.location}} for the appointment?"
    - "Can you bring {{patient.full_name}} to their {{appointment.appointment_type}} in {{appointment.location}}?"
    - "Would you take {{patient.full_name}} over to {{appointment.location}} now?"
    - "Can you get {{patient.full_name}} to {{appointment.location}} for the {{appointment.appointment_type}}?"
    - "Please escort {{patient.full_name}} to {{appointment.location}} when you're ready."
    - "Could you lead {{patient.full_name}} to {{appointment.location}} for their appointment?"
    - "Can you accompany {{patient.full_name}} to {{appointment.location}} now?"
    - "Would you mind taking {{patient.full_name}} to {{appointment.location}} for the {{appointment.appointment_type}}?"
    - "Could you guide {{patient.full_name}} over to {{appointment.location}} now?"
    - "Can you bring {{patient.full_name}} to {{appointment.location}} in time for the appointment?"

  # The robot learns about the change from the appointment record it
  # just looked up - it never announces news it has no source for.
  room_change_notice:
    - "Before we go, I checked the record: the {{appointment.appointment_type}} is now in {{new_location.phrase}}, not {{appointment.location}}. I'll take {{patient.full_name}} there instead."
    - "The record shows the {{appointment.appointment_type}} has moved from {{appointment.location}} to {{new_location.phrase}}, so that's where we'll go."
    - "Quick update from the record — the appointment is in {{new_location.phrase}} now, not {{appointment.location}}. Heading there with {{patient.full_name}}."
    - "I just checked, and the {{appointment.appointment_type}} is listed in {{new_location.phrase}} rather than {{appointment.location}}. I'll take {{patient.full_name}} to {{new_location.phrase}}."
    - "Good thing I looked it up: the room changed from {{appointment.location}} to {{new_location.phrase}}. We'll go there instead."
    - "According to the record, {{patient.full_name}}'s {{appointment.appointment_type}} is now in {{new_location.phrase}}. {{appointment.location}} is no longer listed, so I'll head to {{new_location.phrase}}."
    - "The appointment record has a new room — {{new_location.phrase}} instead of {{appointment.location}}. On our way there now."
    - "Heads up — the record now says {{new_location.phrase}} for the {{appointment.appointment_type}}, not {{appointment.location}}. I'll take {{patient.full_name}} there."


  arrival_confirmation:
    - "We've arrived at {{new_location.phrase}} — {{patient.full_name}} is here for the {{appointment.appointment_type}}."
    - "Here at {{new_location.phrase}} now, right on time for {{patient.full_name}}'s appointment."
    - "We made it to {{new_location.phrase}} — all set for the {{appointment.appointment_type}}."
    - "Arrived at {{new_location.phrase}} with {{patient.full_name}}, ready for the appointment."
    - "That's {{new_location.phrase}} — {{patient.full_name}} is checked in for the {{appointment.appointment_type}}."
    - "We're at {{new_location.phrase}} now, no trouble getting here despite the change."
    - "Made it to {{new_location.phrase}} without any issues, {{patient.full_name}} is all set."
    - "Here now at {{new_location.phrase}} — {{patient.full_name}} is ready for the {{appointment.appointment_type}}."
    - "Arrived without trouble at {{new_location.phrase}} with {{patient.full_name}}."
    - "We're checked in at {{new_location.phrase}} now for the {{appointment.appointment_type}}."
    - "That's us at {{new_location.phrase}} — {{patient.full_name}} is ready to go."
    - "Made it to the new location, {{new_location.phrase}}, with {{patient.full_name}} in tow."
