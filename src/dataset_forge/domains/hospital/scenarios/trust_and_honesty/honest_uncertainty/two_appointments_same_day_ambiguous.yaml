name: two_appointments_same_day_ambiguous

entities:
  patient:
    type: patient
  appointment:
    type: appointment
  alternative_appointment:
    type: appointment

constraints:

  - type: equal
    fields:
      - today
      - appointment.day

  - type: equal
    fields:
      - appointment.day
      - alternative_appointment.day

  - type: different
    fields:
      - appointment.appointment_type
      - alternative_appointment.appointment_type

  - type: different
    fields:
      - appointment.location
      - alternative_appointment.location

language_schema: two_appointments_same_day_ambiguous


# What the robot knows before the conversation starts; rendered
# into the system message by engine/robot_context.py.
robot_context:
  location: patient.room_number
  patient: patient
  speaker: patient
