name: identification_corrected_wrong_person

entities:
  target_patient:
    type: patient
  alternative_patient:
    type: patient

constraints:
  - type: equal
    fields:
      - target_patient.last_name
      - alternative_patient.last_name

  - type: different
    fields:
      - target_patient.patient_id
      - alternative_patient.patient_id

  - type: different
    fields:
      - target_patient.first_name
      - alternative_patient.first_name

  - type: different
    fields:
      - target_patient.room_number
      - alternative_patient.room_number

language_schema: identification_corrected_wrong_person


# What the robot knows before the conversation starts; rendered
# into the system message by engine/robot_context.py.
robot_context:
  location: alternative_patient.room_number
  speaker: staff
  note: "A member of staff asked you to find {{target_patient.title_last_name}}, and you went to this room."
