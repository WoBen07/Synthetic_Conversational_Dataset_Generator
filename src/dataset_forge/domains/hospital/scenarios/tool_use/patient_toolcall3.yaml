name: patient_toolcall3

entities:

  patient:
    type: patient

  appointment:
    type: appointment

  weather:
    type: weather

language_schema: patient_toolcall3


# What the robot knows before the conversation starts; rendered
# into the system message by engine/robot_context.py.
robot_context:
  speaker: unidentified


constraints:

  - type: equal
    fields:
      - today
      - appointment.day
