name: no_match_ask_spelling

entities:
  patient:
    type: patient
  appointment:
    type: appointment

language_schema: no_match_ask_spelling


# What the robot knows before the conversation starts; rendered
# into the system message by engine/robot_context.py.
robot_context:
  speaker: staff


constraints:

  - type: equal
    fields:
      - today
      - appointment.day
