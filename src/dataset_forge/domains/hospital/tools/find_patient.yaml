tool: find_patient

# Format: see documentation/schemas.md#tool-schemas. Argument "source" says
# where the value must come from (known / mentioned / own_words); the
# GroundingValidator enforces it, and engine/tool_definitions.py exports
# everything else as the function definition the model sees.

side_effects: false

description: >
  Searches the patient records by name and/or room number and returns
  every matching patient. Give at least one of name or room_number.

requires_one_of: [name, room_number]


input:

  name:
    type: string
    required: false
    description: >
      Full name, last name or first name - only what was actually said.
    source: mentioned

  room_number:
    type: string
    required: false
    description: Patient room number, e.g. "2004".
    source: mentioned
    format: name


output:

  matches:
    type: list
    item_type: patient
    description: Matching patients; empty when nobody matches.
