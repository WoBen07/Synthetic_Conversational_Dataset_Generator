tool: get_weather

# Format: see documentation/schemas.md#tool-schemas. Argument "source" says
# where the value must come from (known / mentioned / own_words); the
# GroundingValidator enforces it, and engine/tool_definitions.py exports
# everything else as the function definition the model sees.

side_effects: false

description: Returns the current weather condition and temperature.


input:

  location:
    type: string
    required: true
    description: Where to check the weather, e.g. "hospital area".


output:

  condition:
    type: string
    item_type: weather

  temperature:
    type: string
    item_type: weather
