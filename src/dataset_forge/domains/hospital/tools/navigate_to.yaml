tool: navigate_to

# Format: see documentation/schemas.md#tool-schemas. Argument "source" says
# where the value must come from (known / mentioned / own_words); the
# GroundingValidator enforces it, and engine/tool_definitions.py exports
# everything else as the function definition the model sees.

side_effects: true

description: Drives the robot to a room, together with whoever it is escorting.


input:

  room:
    type: string
    required: true
    description: >
      Bare room name or number as given in the conversation or a tool
      result, e.g. "2004" or "Sunroom" - no article.
    source: mentioned
    format: name


output:

  status:
    type: enum
    values: [arrived, unreachable]

  location:
    type: string
