    - "{{patient.full_name}} is in room {{patient.room_number}}. I'll look up the appointment."
    - "Found {{patient.full_name}}. The other {{patient.last_name}} has a different first name, so this is clear. Checking the appointment now."
    - "That's {{patient.full_name}}, room {{patient.room_number}}. Pulling up the appointment."


