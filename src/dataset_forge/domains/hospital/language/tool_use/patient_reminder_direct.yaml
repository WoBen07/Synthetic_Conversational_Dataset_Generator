  # The search also returns another patient with the same last name; the
  # first name settles it, so the robot says which record it uses and goes on.
  direct_pick:
    - "I found two patients named {{patient.last_name}}; {{patient.full_name}} is the one you mean. Checking the appointment."
    - "There are two {{patient.last_name}}s, but only one {{patient.full_name}} — room {{patient.room_number}}. Let me check the appointment."
