variables:
  mode:
  - value: vacuum
    infinitive: saugen
    present: saugt
    noun: Saugen
  - value: mop
    infinitive: wischen
    present: wischt
    noun: Wischen
  - value: vacuum_and_mop
    infinitive: saugen und wischen
    present: saugt und wischt
    noun: Saugen und Wischen
  request:
  - Lass {{vacuum.acc}} die ganze Wohnung {{mode.infinitive}}.
  - Lass {{vacuum.acc}} das ganze Haus {{mode.infinitive}}.
  - '{{vacuum.nom_cap}} soll die ganze Wohnung {{mode.infinitive}}.'
  - '{{vacuum.nom_cap}} soll das ganze Haus {{mode.infinitive}}.'
  - '{{vacuum.nom_cap}} soll alles {{mode.infinitive}}.'
  - '{{vacuum.nom_cap}} soll überall {{mode.infinitive}}.'
  - '{{vacuum.nom_cap}} kann mal alles {{mode.infinitive}}.'
  - Lass {{vacuum.acc}} bitte alles {{mode.infinitive}}.
  - Kannst du {{vacuum.acc}} die komplette Wohnung {{mode.infinitive}} lassen?
  - Starte {{vacuum.acc}}, {{vacuum.pronoun}} soll alles {{mode.infinitive}}.
  - Schick {{vacuum.acc}} los, {{vacuum.pronoun}} soll überall {{mode.infinitive}}.
  - Schick {{vacuum.acc}} zum {{mode.noun}} durchs ganze Haus.
  confirmation:
  - '{{vacuum.reply_cap}} {{mode.present}} jetzt überall.'
  - Alles klar, {{vacuum.reply}} {{mode.present}} jetzt alles.
  - Erledigt, {{vacuum.reply}} ist unterwegs und {{mode.present}} überall.
  - Okay, {{vacuum.reply}} legt los und {{mode.present}} alles.
  - Gemacht, {{vacuum.reply}} {{mode.present}} jetzt überall.
