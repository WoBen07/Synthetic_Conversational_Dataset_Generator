variables:
  power:
  - state: 'on'
    word: an
  - state: 'off'
    word: aus
  request:
  - Mach {{light.acc}} {{light.in_room}} {{power.word}}.
  - Schalte {{light.acc}} {{light.in_room}} {{power.word}}.
  - Schalt mal {{light.acc}} {{light.in_room}} {{power.word}}.
  - Mach bitte {{light.acc}} {{light.in_room}} {{power.word}}.
  - Kannst du {{light.acc}} {{light.in_room}} {{power.word}}machen?
  - Kannst du bitte {{light.acc}} {{light.in_room}} {{power.word}}schalten?
  - Könntest du {{light.acc}} {{light.in_room}} {{power.word}}machen?
  - Bitte {{light.acc}} {{light.in_room}} {{power.word}}schalten.
  failure:
  - Das hat leider nicht geklappt, {{light.nom}} {{light.in_room}} ist gerade nicht erreichbar.
  - '{{light.nom_cap}} {{light.in_room}} reagiert gerade nicht, ich konnte {{light.pron_acc}} nicht schalten.'
  - Tut mir leid, ich erreiche {{light.acc}} {{light.in_room}} gerade nicht.
  - Das ging leider nicht, {{light.nom}} {{light.in_room}} ist nicht erreichbar.
  - '{{light.nom_cap}} {{light.in_room}} ist gerade offline, schalten konnte ich {{light.pron_acc}} nicht.'
