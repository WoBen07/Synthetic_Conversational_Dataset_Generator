tool: adjust_light_brightness

# Format: see documentation/schemas.md#tool-schemas. Argument "source" says
# where the value must come from (known / mentioned / own_words); the
# GroundingValidator enforces it, and engine/tool_definitions.py exports
# everything else as the function definition the model sees.

side_effects: true

description: >
  Macht eine Leuchte um eine Stufe heller oder dunkler, wenn kein Prozentwert genannt wurde.


input:

  room:
    type: string
    required: true
    description: >
      Raum genau so, wie er in der Geräteliste steht, ohne Präposition und
      Artikel.
    source: known
    format: name

  light:
    type: string
    required: false
    description: >
      Name einer Leuchte aus der Geräteliste, z. B. eine Stehlampe.
      Weglassen, wenn allgemein das Licht des Raums gemeint ist.
    source: known
    format: name

  direction:
    type: enum
    values: [brighter, dimmer]
    required: true
    description: brighter für heller, dimmer für dunkler oder dimmen.


output:

  status:
    type: enum
    values: [ok, unavailable, not_supported]
