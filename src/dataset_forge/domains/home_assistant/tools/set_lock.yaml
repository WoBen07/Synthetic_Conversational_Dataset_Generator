tool: set_lock

# Format: see documentation/schemas.md#tool-schemas. Argument "source" says
# where the value must come from (known / mentioned / own_words); the
# GroundingValidator enforces it, and engine/tool_definitions.py exports
# everything else as the function definition the model sees.

side_effects: true

description: >
  Schließt ein Schloss aus der Geräteliste ab oder auf. Vor dem Aufschließen immer erst nachfragen.


input:

  lock:
    type: string
    required: true
    description: Name des Schlosses aus der Geräteliste.
    source: known
    format: name

  action:
    type: enum
    values: [lock, unlock]
    required: true
    description: lock zum Abschließen, unlock zum Aufschließen.


output:

  status:
    type: enum
    values: [ok, unavailable]
