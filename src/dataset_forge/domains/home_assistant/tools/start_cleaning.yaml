tool: start_cleaning

# Format: see documentation/schemas.md#tool-schemas. Argument "source" says
# where the value must come from (known / mentioned / own_words); the
# GroundingValidator enforces it, and engine/tool_definitions.py exports
# everything else as the function definition the model sees.

side_effects: true

description: >
  Schickt den Saugroboter los, um das ganze Zuhause oder einen Raum zu reinigen.


input:

  mode:
    type: enum
    values: [vacuum, mop, vacuum_and_mop]
    required: true
    description: vacuum für saugen, mop für wischen, vacuum_and_mop für beides.

  room:
    type: string
    required: false
    description: >
      Raum genau so, wie er in der Geräteliste steht. Weglassen, wenn das ganze Zuhause gereinigt werden soll.
    source: known
    format: name


output:

  status:
    type: enum
    values: [ok, unavailable, stuck, bin_full]
