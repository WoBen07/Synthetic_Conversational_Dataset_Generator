tool: HassMediaSearchAndPlay
side_effects: true
description: Sucht nach Musik und spielt sie in einem Raum ab.
input:
  area:
    type: string
    description: Raum genau so, wie er in der Geräteliste steht.
    source: known
    format: name
  search_query:
    type: string
    required: true
    description: Wonach gesucht werden soll.
    source: mentioned
output:
  status:
    type: enum
    values:
    - ok
    - unavailable
    - not_supported
    - stuck
    - bin_full
    - not_found
  state:
    type: enum
    values:
    - 'on'
    - 'off'
  brightness_pct:
    type: integer
  color:
    type: string
  temperature:
    type: number
  current_temperature:
    type: number
  target_temperature:
    type: number
  humidity_pct:
    type: integer
  window_open:
    type: boolean
