tool: get_patient_appointment

# Format: see documentation/schemas.md#tool-schemas. Argument "source" says
# where the value must come from (known / mentioned / own_words); the
# GroundingValidator enforces it, and engine/tool_definitions.py exports
# everything else as the function definition the model sees.

side_effects: false

description: >
  Returns the next appointment of a patient: type, day and location.


input:

  patient_id:
    type: string
    required: true
    description: ID from the context or an earlier find_patient result.
    source: known


output:

  patient_id:
    type: string

  name:
    type: string

  appointment:
    type: object
    item_type: appointment
    nullable: true
    description: >
      null when the patient has no appointment on file. A missing field
      inside (e.g. no location) means the record is incomplete.

  appointments:
    type: list
    item_type: appointment
    description: Instead of appointment when several are booked for the same day.

  status:
    type: enum
    values: [error]
    description: Only present when the lookup failed.

  error:
    type: string
    description: Error code when the lookup failed, e.g. "connection_timeout".
