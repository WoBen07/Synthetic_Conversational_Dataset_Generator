name: appointment_stale_cache_recheck

entities:
  patient:
    type: patient
  appointment:
    type: appointment

language_schema: appointment_stale_cache_recheck


# What the robot knows before the conversation starts; rendered
# into the system message by engine/robot_context.py.
robot_context:
  location: patient.room_number
  patient: patient
  speaker: patient


constraints:

  - type: equal
    fields:
      - today
      - appointment.day
