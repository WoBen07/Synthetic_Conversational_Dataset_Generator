variables:

  # One entry per request so question, explanation, offer and the
  # notify_staff reason always describe the same thing.
  capability:
    - question: "Can you check my blood pressure for me?"
      clarification: "I'm not able to do that — I don't have the equipment or training to take vitals."
      offer: "What I can do is let the nursing team know you'd like your blood pressure checked."
      reason: "Patient would like their blood pressure checked."
    - question: "Can you give me my medication?"
      clarification: "I'm sorry, that's not something I can do — I'm not able to handle or hand out medication."
      offer: "I can let a nurse know you're asking about your medication."
      reason: "Patient is asking for their medication."
    - question: "Could you change the bandage on my arm?"
      clarification: "I'm not able to change bandages or give any physical care — that needs to be done by a nurse."
      offer: "I can let a nurse know your bandage needs to be looked at."
      reason: "Patient asks for the bandage on their arm to be changed."
    - question: "Can you tell me what's wrong with me?"
      clarification: "I'm not able to give a diagnosis or a medical opinion — that's something your doctor needs to look at."
      offer: "I can let your doctor's team know you have questions about your condition."
      reason: "Patient has questions about their condition and would like to talk to their doctor."
    - question: "Could you draw my blood for the test?"
      clarification: "I can't take blood — that has to be done by trained staff."
      offer: "I can let the team know you're ready for your blood draw."
      reason: "Patient says they are ready for their blood draw."
    - question: "Can you adjust my IV drip?"
      clarification: "I'm not able to do anything with your IV or other medical equipment — that needs a trained member of staff."
      offer: "I can let a nurse know you'd like your IV checked."
      reason: "Patient asks for their IV drip to be checked and adjusted."
    - question: "Can you tell my doctor to come and see me?"
      clarification: "I'm not able to call your doctor in directly."
      offer: "I can pass along that you'd like to speak with your doctor as soon as they can."
      reason: "Patient would like their doctor to come and see them."
    - question: "Could you check if my medication is due?"
      clarification: "I don't have access to medication schedules, so I can't check that myself."
      offer: "I can ask staff to check your medication schedule for you."
      reason: "Patient asks whether their next dose of medication is due."
    - question: "Can you remove my catheter?"
      clarification: "I'm not able to remove or handle any medical device — that has to be a trained professional."
      offer: "I can let a nurse know you'd like your catheter looked at."
      reason: "Patient asks about having their catheter removed."
    - question: "Can you tell me my test results?"
      clarification: "I don't have access to test results, and they should be explained by your doctor."
      offer: "I can let your doctor's team know you'd like to go over your results."
      reason: "Patient would like to go over their test results with the doctor."
    - question: "Could you give me a shot for the pain?"
      clarification: "I'm not able to give injections or any other medication."
      offer: "I can let a nurse know you're in pain and asking for pain relief."
      reason: "Patient is in pain and asks for pain relief."
    - question: "Can you take my temperature?"
      clarification: "I don't have a thermometer or the training to take your temperature."
      offer: "I can ask a nurse to come and take it."
      reason: "Patient would like their temperature taken."
    - question: "Could you renew my prescription?"
      clarification: "I can't order or change prescriptions — that goes through your doctor."
      offer: "I can let the care team know you need your prescription renewed."
      reason: "Patient asks for their prescription to be renewed."
    - question: "Can you check my blood sugar?"
      clarification: "I can't take measurements like that — I don't have the equipment or the training."
      offer: "I can let a nurse know you'd like your blood sugar checked."
      reason: "Patient would like their blood sugar checked."


  user_response:
    - "Okay, that would be great, thanks."
    - "Sure, that works, thank you."
    - "Alright, please do."
    - "Yes please, that would help."
    - "Okay, thank you for letting them know."
    - "That's fine, thanks for passing it on."
    - "Okay, I appreciate it."
    - "Sure, thanks for helping with that."
    - "Okay, that sounds good, thank you."
    - "Alright, please let them know."
    - "Sure, I'd appreciate that."
    - "Okay, thanks for checking on that."
    - "That works, thank you."
    - "Yes, please, thanks for helping."

  closing:
    - "I've made a note of it — someone should be with you shortly."
    - "Consider it done, I'll let them know right away."
    - "Alright, I'll pass that along now."
    - "Done — staff will follow up with you soon."
    - "Okay, that's been noted for the team."
    - "I'll take care of letting them know now."
    - "Noted — thank you for your patience."
    - "I've flagged it for staff, they'll be with you soon."
    - "I've let them know, someone will be with you soon."
    - "That's taken care of, thank you for your patience."
    - "I'll make sure this gets to the right person."
    - "Noted, staff should be along shortly."
    - "I've passed it along, they'll be in touch."
    - "Done — I'll keep an eye out and follow up if needed."
