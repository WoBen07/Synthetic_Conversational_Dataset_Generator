variables:

  # Question, offer and reason belong together: an offer to find an
  # interpreter makes no sense after a question about halal food.
  request:
    - question: "Do you speak Spanish?"
      offer: "I can ask the staff whether someone who speaks Spanish is available."
      reason: "Patient would like to speak with someone in Spanish."
    - question: "Can you say this in French for me?"
      offer: "I can ask staff whether a French-speaking colleague or an interpreter is available."
      reason: "Patient needs information in French; a French speaker or interpreter is requested."
    - question: "Do you know anything about Ramadan and what I might need during it?"
      offer: "I can ask the care team to talk with you about your needs during Ramadan, such as meal times."
      reason: "Patient is observing Ramadan and would like to discuss their needs, such as meal times."
    - question: "Can you talk to me in my native language?"
      offer: "I can ask staff to arrange an interpreter in your language."
      reason: "Patient would prefer to communicate in their native language; an interpreter may be needed."
    - question: "Do you understand the dietary rules of my religion?"
      offer: "I can ask the team to go over your dietary requirements with you."
      reason: "Patient has religious dietary requirements and would like to discuss them."
    - question: "Can you translate what the nurse said for me?"
      offer: "I can ask for an interpreter so the nurse's explanation can be translated properly."
      reason: "Patient needs an interpreter to understand what the nurse explained."
    - question: "Do you know what I need to do to get a kosher meal?"
      offer: "I can let the team know you'd like kosher meals so the kitchen can arrange them."
      reason: "Patient requests kosher meals."
    - question: "Can you speak Mandarin with me?"
      offer: "I can ask whether a Mandarin-speaking colleague or an interpreter is available."
      reason: "Patient would like to speak with someone in Mandarin."
    - question: "Do you know any Arabic phrases that could help me?"
      offer: "I can ask staff whether someone who speaks Arabic can help you."
      reason: "Patient would like support from someone who speaks Arabic."
    - question: "Can you tell me about halal food options here?"
      offer: "I can ask the team to tell you about the halal meal options."
      reason: "Patient asks about halal meal options."
    - question: "Will anything happen for Diwali here? It matters a lot to my family."
      offer: "I can ask the team whether anything can be arranged for Diwali."
      reason: "Patient's family celebrates Diwali; patient asks whether anything can be arranged."
    - question: "Can you explain this to my family in Portuguese?"
      offer: "I can ask for a Portuguese interpreter for your family."
      reason: "Patient's family needs a Portuguese interpreter."
    - question: "Do you know the customs around fasting in my religion?"
      offer: "I can let the team know you're fasting so they can plan your meals and care around it."
      reason: "Patient is fasting for religious reasons; meals and care should take this into account."
    - question: "Can you speak Hindi with my visitors?"
      offer: "I can ask whether someone who speaks Hindi is available for your visitors."
      reason: "Patient's visitors would like to speak with someone in Hindi."


