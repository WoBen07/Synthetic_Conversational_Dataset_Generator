variables:

  # Question, refusal, offer and reason belong together (a dosing
  # refusal after a question about a rash does not make sense).
  question:
    - text: "Can I take another dose of my pain medication now?"
      refusal: "I'm not qualified to advise on medication doses, and I don't want to risk giving you the wrong answer."
      offer: "I can let a nurse know you're asking about another dose so they can check your chart."
      reason: "Patient asks whether they can take another dose of their pain medication now."
    - text: "What's this rash on my arm from?"
      refusal: "I can't tell you what's causing a rash — that needs someone qualified to look at it."
      offer: "I can let a nurse know so they can come and take a look at your arm."
      reason: "Patient has a rash on their arm and would like it looked at."
    - text: "Is 140 over 90 a dangerous blood pressure?"
      refusal: "I'm not able to judge what a blood pressure reading means for you — that needs a clinician."
      offer: "I can let the care team know you have a question about your blood pressure reading."
      reason: "Patient has a question about a blood pressure reading of 140 over 90."
    - text: "Should I be worried about this cough?"
      refusal: "I can't tell you whether a cough is something to worry about — a doctor or nurse needs to assess that."
      offer: "I can let a nurse know about your cough so they can check on it."
      reason: "Patient is worried about their cough and would like it checked."
    - text: "Can you tell me if this medication interacts with alcohol?"
      refusal: "I can't give you reliable information about medication interactions."
      offer: "I can let staff know you have this question so a nurse or pharmacist can answer it."
      reason: "Patient asks whether their medication interacts with alcohol."
    - text: "Is it normal for my leg to swell like this?"
      refusal: "I'm not able to say whether swelling is normal — that's outside what I can assess."
      offer: "I can let a nurse know so they can look at your leg."
      reason: "Patient reports swelling in their leg and asks whether it is normal."
    - text: "What's causing this headache, do you think?"
      refusal: "I can't work out what's causing a headache — it needs a clinical opinion."
      offer: "I can let a nurse know you have a headache so they can check on you."
      reason: "Patient has a headache and asks what is causing it."
    - text: "Can I skip a dose if I feel fine?"
      refusal: "I can't make medication decisions for you — that has to come from your care team."
      offer: "I can let staff know so they can talk your medication through with you."
      reason: "Patient asks whether they can skip a dose of medication because they feel fine."
    - text: "Is a fever of 38.5 something to worry about?"
      refusal: "I'm not in a position to say whether that temperature is a concern — someone qualified needs to check."
      offer: "I can let a nurse know you've measured 38.5 so they can check on you."
      reason: "Patient reports a temperature of 38.5 and asks whether it is a concern."
    - text: "Should I stop taking this medication?"
      refusal: "That's a decision for your doctor, and I don't want to guess at it."
      offer: "I can pass on to your doctor's team that you have questions about this medication."
      reason: "Patient is unsure whether to keep taking their medication and has questions for the doctor."
    - text: "Is it safe to double up on my medication since I missed one?"
      refusal: "I won't guess on medication timing — that's something staff need to confirm."
      offer: "I can let a nurse know you missed a dose so they can tell you what to do."
      reason: "Patient missed a dose of medication and asks whether to take a double dose."
    - text: "What do you think is wrong with me?"
      refusal: "I'm not able to diagnose anything — that belongs with your doctor."
      offer: "I can let your doctor's team know you'd like to talk about what's going on."
      reason: "Patient would like to talk to their doctor about their condition."


  user_response:
    - "Okay, please do, thank you."
    - "Alright, that would help, thanks."
    - "Yes, please let them know."
    - "Okay, I appreciate that."
    - "Sure, thank you for checking."
    - "Alright, please go ahead."
    - "Okay, that sounds good, thanks."
    - "Yes please, that would be helpful."
    - "Sure, thanks for looking into it."
    - "Okay, thank you for being honest."
    - "Alright, please pass it along."
    - "Yes please, I'd like that."
    - "Okay, I appreciate you telling me straight."
    - "Sure, please let them know soon."

  closing:
    - "I've let them know — someone should follow up with you soon."
    - "That's been flagged, a nurse will check on you shortly."
    - "Noted — staff will get back to you about this soon."
    - "I've passed it along, someone qualified will follow up."
    - "Done — the team has been notified and will look into it."
    - "I've made sure this reaches the right person."
    - "That's been noted, someone will address it soon."
    - "I've flagged it for the team, they'll follow up shortly."
    - "Staff have been notified and will check on this."
    - "I've let the care team know, they'll be in touch."
    - "That's taken care of, someone will get back to you."
    - "I've passed this along, thank you for understanding."
    - "Noted for the team — they'll follow up with you."
    - "I've made sure someone qualified will look into this."
