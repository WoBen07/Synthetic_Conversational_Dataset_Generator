variables:
  power:
  - state: 'on'
    word: an
  - state: 'off'
    word: aus
  request:
  - Mach {{switch.acc}} {{power.word}}.
  - Schalte {{switch.acc}} {{power.word}}.
  - Kannst du {{switch.acc}} {{power.word}}machen?
  - '{{switch.nom_cap}} bitte {{power.word}}.'
  - Schalt mal {{switch.acc}} {{power.word}}.
  refusal:
  - '{{switch.acc_cap}} kann ich hier nicht steuern.'
  - '{{switch.nom_cap}} steht nicht in meiner Geräteliste.'
  - Das geht leider nicht, {{switch.nom}} ist hier nicht eingerichtet.
  - '{{switch.acc_cap}} kenne ich hier nicht.'
