variables:
  mode:
  - value: vacuum
    infinitive: saugen
    present: saugt
    noun: Saugen
  - value: mop
    infinitive: wischen
    present: wischt
    noun: Wischen
  - value: vacuum_and_mop
    infinitive: saugen und wischen
    present: saugt und wischt
    noun: Saugen und Wischen
  request:
  - Lass {{vacuum.acc}} die ganze Wohnung {{mode.infinitive}}.
  - Lass {{vacuum.acc}} das ganze Haus {{mode.infinitive}}.
  - '{{vacuum.nom_cap}} soll die ganze Wohnung {{mode.infinitive}}.'
  - '{{vacuum.nom_cap}} soll das ganze Haus {{mode.infinitive}}.'
  - '{{vacuum.nom_cap}} soll alles {{mode.infinitive}}.'
  - '{{vacuum.nom_cap}} soll überall {{mode.infinitive}}.'
  - '{{vacuum.nom_cap}} kann mal alles {{mode.infinitive}}.'
  - Lass {{vacuum.acc}} bitte alles {{mode.infinitive}}.
  failure:
  - Der Staubbehälter von {{vacuum.reply_dat}} ist voll, bitte einmal leeren.
  - Das geht gerade nicht, der Behälter von {{vacuum.reply_dat}} ist voll.
  - '{{vacuum.reply_cap}} kann nicht los, der Staubbehälter ist voll.'
  - Leider nein, erst muss der Behälter von {{vacuum.reply_dat}} geleert werden.
