tool: adjust_light_color_temperature

# Format: see documentation/schemas.md#tool-schemas. Argument "source" says
# where the value must come from (known / mentioned / own_words); the
# GroundingValidator enforces it, and engine/tool_definitions.py exports
# everything else as the function definition the model sees.

side_effects: true

description: >
  Macht das weiße Licht einer Leuchte wärmer oder kälter. Nur aufrufen, wenn get_light_capabilities supports_color_temperature bestätigt hat. Für die Raumtemperatur ist adjust_room_temperature da.


input:

  room:
    type: string
    required: true
    description: >
      Raum genau so, wie er in der Geräteliste steht, ohne Präposition und
      Artikel.
    source: known
    format: name

  light:
    type: string
    required: false
    description: >
      Name einer Leuchte aus der Geräteliste, z. B. eine Stehlampe.
      Weglassen, wenn allgemein das Licht des Raums gemeint ist.
    source: known
    format: name

  direction:
    type: enum
    values: [warmer, cooler]
    required: true
    description: warmer für wärmer, cooler für kälter oder kühler.


output:

  status:
    type: enum
    values: [ok, unavailable]
