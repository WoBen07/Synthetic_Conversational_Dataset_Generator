tool: set_blinds

# Format: see documentation/schemas.md#tool-schemas. Argument "source" says
# where the value must come from (known / mentioned / own_words); the
# GroundingValidator enforces it, and engine/tool_definitions.py exports
# everything else as the function definition the model sees.

side_effects: true

description: >
  Bewegt die Rollläden eines Raums. Gib entweder action oder position_pct an.


input:

  room:
    type: string
    required: true
    description: >
      Raum genau so, wie er in der Geräteliste steht, ohne Präposition und
      Artikel.
    source: known
    format: name

  action:
    type: enum
    values: [open, close, stop]
    required: false
    description: open für hoch, close für runter, stop zum Anhalten.

  position_pct:
    type: integer
    required: false
    minimum: 0
    maximum: 100
    description: Position in Prozent, 0 ist ganz unten, 100 ganz oben.
    source: known


output:

  status:
    type: enum
    values: [ok, unavailable]
