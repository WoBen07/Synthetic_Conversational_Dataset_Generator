# Generation settings of the home_assistant domain (amounts, tool shares).
# Engine-wide settings live in config/generation_config.yaml.

default_amount: 250

# Per-template overrides, keyed by the template's leaf name
important_templates: {}

# Per-category amounts, keyed by template-path prefix
category_amounts: {}

# Minimum share of all tool calls per tool
tool_share_targets: {}

tool_share_max_scale: 2.0
